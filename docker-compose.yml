# Self-hosted stack: Postgres 16 + the public-feed jobs (fetch every 15 min).
#   docker compose up -d --build
#   docker compose logs -f jobs
#   docker compose down -v        # remove everything, including the data volume
#
# The api and worker (profile "app") connect as an rp_app login, never as the
# superuser above. Create it once (docs/database-roles.md, "Self-hosting"), put
# DATABASE_URL_APP and the api/worker variables in .env (see .env.example), then:
#   docker compose --profile app up -d --build
# The web service joins this file in a later step.
name: riskpredict

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: riskpredict
      POSTGRES_USER: riskpredict
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-riskpredict-local}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # local machine only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riskpredict -d riskpredict"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  jobs:
    build:
      context: .
      dockerfile: jobs/Dockerfile
    environment:
      DATABASE_URL_FEEDS: postgresql://riskpredict:${POSTGRES_PASSWORD:-riskpredict-local}@postgres:5432/riskpredict
      RUN_EVERY_SECONDS: "900"
      SOURCES: ${SOURCES:-all}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: api/Dockerfile
    environment: &app_env
      DATABASE_URL_APP: ${DATABASE_URL_APP:-}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-}
      TOKEN_ENCRYPTION_KEYS: ${TOKEN_ENCRYPTION_KEYS:-}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
      API_INTERNAL_URL: http://api:8000
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_PICKER_API_KEY: ${GOOGLE_PICKER_API_KEY:-}
      GOOGLE_CLOUD_PROJECT_NUMBER: ${GOOGLE_CLOUD_PROJECT_NUMBER:-}
      COMPOSIO_API_KEY: ${COMPOSIO_API_KEY:-}
      COMPOSIO_WEBHOOK_SECRET: ${COMPOSIO_WEBHOOK_SECRET:-}
      COMPOSIO_AUTH_CONFIGS: ${COMPOSIO_AUTH_CONFIGS:-}
      COMPOSIO_TRIGGER_SLUGS: ${COMPOSIO_TRIGGER_SLUGS:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MAPPING_MODEL: ${GROQ_MAPPING_MODEL:-}
      GROQ_ADVICE_MODEL: ${GROQ_ADVICE_MODEL:-}
    ports:
      - "127.0.0.1:8000:8000" # local machine only
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment: *app_env
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
