  /v1/feeds/events/{source}/{raw_id}:
    get:
      tags: [feeds]
      operationId: getFeedEvent
      summary: Get feed event
      parameters:
        - {name: source, in: path, required: true, schema: {type: string}}
        - {name: raw_id, in: path, required: true, description: URL-encoded, schema: {type: string}}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FeedEvent"}
        "404": {$ref: "#/components/responses/NotFound"}

  /v1/feeds/anomalies:
    get:
      tags: [feeds]
      operationId: listAnomalies
      summary: List anomalies
      parameters:
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Cursor"}
        - {name: series, in: query, description: Exact series or prefix ending in ".", schema: {type: string}}
        - {name: key, in: query, schema: {type: string}}
        - {name: method, in: query, schema: {type: string, enum: [robust_z, isolation_forest]}}
        - {name: since, in: query, schema: {type: string, format: date-time}}
      responses:
        "200":
          description: Page of anomalies, newest ts first
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: "#/components/schemas/Page"}
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: {$ref: "#/components/schemas/Anomaly"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /v1/feeds/series:
    get:
      tags: [feeds]
      operationId: getSeries
      summary: Points of one series key (for evidence charts)
      parameters:
        - {name: series, in: query, required: true, schema: {type: string, examples: [fx.rate]}}
        - {name: key, in: query, required: true, schema: {type: string, examples: [EUR/TRY]}}
        - {name: since, in: query, description: "Default: 120 days ago", schema: {type: string, format: date-time}}
      responses:
        "200":
          description: Points in time order, plus anomalies flagged on them
          content:
            application/json:
              schema:
                type: object
                required: [series, key, unit, points, anomalies]
                properties:
                  series: {type: string}
                  key: {type: string}
                  unit: {type: [string, "null"]}
                  points:
                    type: array
                    items:
                      type: object
                      required: [ts, value]
                      properties:
                        ts: {type: string, format: date-time}
                        value: {type: number}
                  anomalies:
                    type: array
                    items: {$ref: "#/components/schemas/Anomaly"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /v1/feeds/health:
    get:
      tags: [feeds]
      operationId: getFeedHealth
      summary: Freshness of every public source and analysis ("data as of")
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [sources, analyses]
                properties:
                  sources:
                    type: array
                    items: {$ref: "#/components/schemas/SourceHealth"}
                  analyses:
                    type: array
                    description: Only subject `*` rows (one per analysis job)
                    items:
                      type: object
                      required: [analysis, status, last_run_at]
                      properties:
                        analysis: {type: string, enum: [tagging, anomalies]}
                        status: {type: string}
                        last_run_at: {type: string, format: date-time}
                        last_success_at: {type: [string, "null"], format: date-time}
        "401": {$ref: "#/components/responses/Unauthorized"}

  # --- scenarios ------------------------------------------------------------------
  /v1/scenarios:
    get:
      tags: [scenarios]
      operationId: listScenarios
      summary: List scenarios
      parameters:
        - {$ref: "#/components/parameters/WorkspaceHeader"}
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Cursor"}
      responses:
        "200":
          description: Page of scenarios, newest first (without `results`)
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: "#/components/schemas/Page"}
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: {$ref: "#/components/schemas/ScenarioSummary"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    post:
      tags: [scenarios]
      operationId: runScenario
      summary: Run a what-if (editor); synchronous, at most 20 s
      description: Runs the engine on the workspace's entities with the inputs applied (`engine.run_scenario`). Writes only the `biz.scenarios` row; real risks are untouched. When the engine is not installed or fails, the scenario is stored with `status` = `failed` and a safe `error`.
      parameters:
        - {$ref: "#/components/parameters/WorkspaceHeader"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, inputs]
              properties:
                name: {type: string, minLength: 1, maxLength: 200}
                description: {type: string, maxLength: 2000}
                inputs: {$ref: "#/components/schemas/ScenarioInputs"}
      responses:
        "201":
          description: Completed (or failed, with `error`)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Scenario"}
        "422": {$ref: "#/components/responses/Unprocessable"}

  /v1/scenarios/{scenario_id}:
    parameters:
      - {$ref: "#/components/parameters/WorkspaceHeader"}
      - {name: scenario_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [scenarios]
      operationId: getScenario
      summary: Get scenario
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Scenario"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [scenarios]
      operationId: deleteScenario
      summary: Delete scenario
      responses:
        "204": {description: Deleted}
        "401": {$ref: "#/components/responses/Unauthorized"}

  # --- alerts --------------------------------------------------------------------------
  /v1/alerts:
    get:
      tags: [alerts]
      operationId: listAlerts
      summary: List alerts
      parameters:
        - {$ref: "#/components/parameters/WorkspaceHeader"}
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Cursor"}
        - {name: unread, in: query, schema: {type: boolean}}
      responses:
        "200":
          description: Page of alerts, newest first
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: "#/components/schemas/Page"}
                  - type: object
                    required: [items, unread_count]
                    properties:
                      items:
                        type: array
                        items: {$ref: "#/components/schemas/Alert"}
                      unread_count: {type: integer, minimum: 0}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /v1/alerts/{alert_id}:
    patch:
      tags: [alerts]
      operationId: updateAlert
      summary: Update alert
      parameters:
        - {$ref: "#/components/parameters/WorkspaceHeader"}
        - {name: alert_id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [read]
              properties:
                read: {type: boolean}
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Alert"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /v1/alerts/read-all:
    post:
      tags: [alerts]
      operationId: readAllAlerts
      summary: Read all alerts
      parameters:
        - {$ref: "#/components/parameters/WorkspaceHeader"}
      responses:
        "204": {description: All marked read}
        "401": {$ref: "#/components/responses/Unauthorized"}

  # --- live updates (polling) ---------------------------------------------------------
  /v1/events:
    get:
      tags: [events]
      operationId: listEvents
      summary: Live updates for one workspace (polled)
      description: |
        The dashboard calls this about every 15 s while its tab is visible, and not at
        all while it is hidden (each call wakes the database). Without `after`, it
        returns no items and the newest id as `next`: start there, the page was just
        loaded. With `after`, it returns the events after that id, oldest first, at most
        `limit`; `more` means call again at once with `next`. Events are kept 24 hours.
        When `after` is older than that (or from a database that was reset), the answer
        is `resync: true` with no items: refetch what is shown and continue from `next`.
        Ids are increasing but not consecutive (one sequence for all workspaces). An
        event is returned only once every transaction that started before it has ended,
        so a cursor never skips one that committed late.

        | event | data |
        |---|---|
        | `risk.created` | `RiskEvent` |
        | `risk.updated` | `RiskEvent` (score moved ≥ 1, or status changed) |
        | `risk.resolved` | `RiskEvent` |
        | `alert.created` | `Alert` |
        | `source.sync_started` | `SourceEvent` |
        | `source.synced` | `SourceEvent` |
        | `source.sync_failed` | `SourceEvent` |
        | `mapping.suggested` | `MappingEvent` |
        | `connection.updated` | `ConnectionEvent` |
        | `feeds.updated` | `FeedsUpdatedEvent` |
        | `resync` | `{}` (never stored: the `resync` flag of the response) |
      parameters:
        - {$ref: "#/components/parameters/WorkspaceHeader"}
        - {name: after, in: query, schema: {type: integer, minimum: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}
      responses:
        "200":
          description: Events after the cursor
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EventPage"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  # --- inbound webhooks ---------------------------------------------------------------
  /v1/webhooks/google-drive:
    post:
      tags: [webhooks]
      operationId: driveNotification
      summary: Google Drive changes.watch push notification
      description: |
        Google sends no body. The API:
        1. Looks up `X-Goog-Channel-ID` with `biz.route_drive_channel`.
        2. Compares sha256(`X-Goog-Channel-Token`) with `watch_token_hash` (constant time) and checks `X-Goog-Resource-ID`.
        3. Inserts `biz.webhook_events` with delivery id `<channel id>:<message number>`, ON CONFLICT DO NOTHING.
        4. For `X-Goog-Resource-State: change`, runs `changes.list` and the syncs it causes within the same request, for about 20 s under a per-workspace lease (a burst of notifications runs once). Whatever is left stays queued for the next worker run.
        It answers 200 quickly for every well-formed notification, also for unknown
        channels or a wrong token, so Google does not retry and a caller learns nothing.
        A request without the required `X-Goog-*` headers gets 400. `sync` messages are
        recorded and ignored.
      security: []
      parameters:
        - {name: X-Goog-Channel-ID, in: header, required: true, schema: {type: string}}
        - {name: X-Goog-Channel-Token, in: header, required: true, schema: {type: string}}
        - {name: X-Goog-Resource-ID, in: header, required: true, schema: {type: string}}
        - {name: X-Goog-Resource-State, in: header, required: true, schema: {type: string, enum: [sync, change, add, remove, update, trash, untrash]}}
        - {name: X-Goog-Message-Number, in: header, required: true, schema: {type: string}}
        - {name: X-Goog-Channel-Expiration, in: header, schema: {type: string}}
      responses:
        "200": {description: Accepted}
        "400": {$ref: "#/components/responses/BadRequest"}

  /v1/webhooks/composio:
    post:
      tags: [webhooks]
      operationId: composioTrigger
      summary: Composio trigger / connection-status webhook
      description: |
        Checked against Composio's docs (REST API v3.1, V3 webhook payloads). The API:
        1. Verifies the signature: `webhook-signature` is `v1,<base64 HMAC-SHA256>` over
           `{webhook-id}.{webhook-timestamp}.{raw body}`, keyed with `COMPOSIO_WEBHOOK_SECRET`
           **as UTF-8 bytes** (unlike the Standard Webhooks `whsec_` form, the secret is not
           base64-decoded). The header may hold several space-separated `v1,…` values; any
           match is enough. `webhook-timestamp` (Unix seconds) must be within 5 minutes. An
           invalid signature gets 401.
        2. Finds the connected account: `metadata.connected_account_id` for trigger events
           (`type` = `composio.trigger.message`), `data.id` for connected-account lifecycle
           events (`type` = `composio.connected_account.*`, e.g. `.expired`), and routes it
           with `biz.route_composio_account`.
        3. Inserts `biz.webhook_events` (delivery id = `webhook-id`, which equals the payload
           `id` and is stable across retries), ON CONFLICT DO NOTHING. Only ids, the event
           type, trigger slug and status are kept, never the record data.
        4. Within the same request (about 20 s, under a per-workspace lease), re-reads the
           connection's sources (trigger) or re-checks the account's status with Composio
           (lifecycle). Whatever is left stays queued for the next worker run.
        Unknown accounts get 200, and the delivery is dropped.
      security: []
      parameters:
        - {name: webhook-id, in: header, required: true, schema: {type: string}}
        - {name: webhook-timestamp, in: header, required: true, schema: {type: string}}
        - {name: webhook-signature, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Composio's V3 payload; only these fields are read.
              properties:
                id: {type: string, description: "Equals the webhook-id header (msg_…)"}
                type: {type: string, examples: [composio.trigger.message, composio.connected_account.expired]}
                metadata:
                  type: object
                  description: Trigger events
                  additionalProperties: true
                  properties:
                    connected_account_id: {type: string}
                    trigger_slug: {type: string}
                    toolkit_slug: {type: string}
                data:
                  type: object
                  description: "The trigger's event payload; for lifecycle events, the connected account (`id`, `status`)"
                  additionalProperties: true
                  properties:
                    id: {type: string}
                    status: {type: string}
      responses:
        "200": {description: Accepted}
        "401": {$ref: "#/components/responses/Unauthorized"}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Access token from sign-in/refresh. Claims: `sub` (user id), `sid` (session id), `iat`, `exp`, `iss` = "riskpredict-api", `aud` = "riskpredict-web". HS256 with `JWT_SIGNING_KEY`.'

  parameters:
    WorkspaceHeader:
      name: X-Workspace-Id
      in: header
      required: true
      description: The workspace to act on; the caller must be a member.
      schema: {type: string, format: uuid}
    WorkspaceIdPath:
      name: workspace_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ConnectionIdPath:
      name: connection_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    SourceIdPath:
      name: source_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    RiskIdPath:
      name: risk_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    Cursor:
      name: cursor
      in: query
      description: Opaque; from the previous page's `next_cursor`
      schema: {type: string}
    Bbox:
      name: bbox
      in: query
      description: "minLon,minLat,maxLon,maxLat (WGS84); minLon > maxLon crosses the antimeridian. Filters positioned features only: features without a position are always included, and the dashboard places them by country/port (the API has no country geometries)."
      schema: {type: string, pattern: "^-?\\d+(\\.\\d+)?(,-?\\d+(\\.\\d+)?){3}$", examples: ["-10,35,30,60"]}

  responses:
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Unauthorized:
      description: Missing, invalid or expired credentials
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Forbidden:
      description: Role too low
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    NotFound:
      description: Not found (or not visible to the caller)
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Conflict:
      description: Conflicts with the current state
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Unprocessable:
      description: Validation failed; see `errors`
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    RateLimited:
      description: Too many requests
      headers:
        Retry-After:
          schema: {type: integer}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Unavailable:
      description: An upstream service (Groq, Google, Composio) is unavailable
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}

  schemas:
    # --- shared ---------------------------------------------------------------------------
    Problem:
      type: object
      description: RFC 9457 problem details. `detail` is safe to show; it never contains tokens, SQL or row contents.
      required: [type, title, status, code]
      properties:
        type: {type: string, format: uri-reference, default: about:blank}
        title: {type: string}
        status: {type: integer}
        code:
          type: string
          enum:
            - bad_request
            - workspace_required
            - unauthenticated
            - invalid_credentials
            - account_locked
            - token_expired
            - refresh_reused
            - forbidden
            - not_found
            - conflict
            - email_taken
            - last_owner
            - connection_not_active
            - validation_failed
            - rate_limited
            - ai_unavailable
            - upstream_unavailable
            - internal
        detail: {type: string}
        instance: {type: string}
        errors:
          type: array
          description: Field errors for `validation_failed`
          items:
            type: object
            required: [field, message]
            properties:
              field: {type: string, description: "JSON pointer into the request body, e.g. /inputs/shocks/0/radius_km"}
              message: {type: string}
    Page:
      type: object
      required: [next_cursor]
      properties:
        next_cursor: {type: [string, "null"]}
    Country:
      type: string
      pattern: "^[A-Z]{3}$"
      description: ISO 3166-1 alpha-3
    Locode:
      type: string
      pattern: "^[A-Z]{2}[A-Z2-9]{3}$"
      description: UN/LOCODE without the space
    Currency:
      type: string
      pattern: "^[A-Z]{3}$"
      description: ISO 4217
    Role:
      type: string
      enum: [owner, admin, editor, viewer]

    # --- auth & workspaces ------------------------------------------------------------
    Tokens:
      type: object
      required: [access_token, access_token_expires_at, refresh_token, refresh_token_expires_at, token_type]
      properties:
        token_type: {type: string, enum: [Bearer]}
        access_token: {type: string}
        access_token_expires_at: {type: string, format: date-time}
        refresh_token: {type: string, description: "Opaque, 43 base64url characters (32 random bytes). Stored server-side as sha256 only."}
        refresh_token_expires_at: {type: string, format: date-time}
    AuthResult:
      allOf:
        - {$ref: "#/components/schemas/Tokens"}
        - type: object
          required: [user, workspace_id]
          properties:
            user: {$ref: "#/components/schemas/User"}
            workspace_id: {type: [string, "null"], format: uuid, description: "The new workspace (sign-up), or the workspace the user joined most recently (sign-in; the dashboard may remember the last one it used). Null when the user belongs to none"}
    User:
      type: object
      required: [id, email, display_name, created_at]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        display_name: {type: [string, "null"]}
        created_at: {type: string, format: date-time}
    Workspace:
      type: object
      required: [id, name, base_currency, alert_min_score, share_watch_terms, created_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        base_currency:
          oneOf: [{$ref: "#/components/schemas/Currency"}, {type: "null"}]
        alert_min_score: {type: number, minimum: 0, maximum: 100}
        share_watch_terms: {type: boolean, description: "Opt-in: let the worker add package names and critical supplier names to the public feed queries (OSV, GDELT)"}
        created_at: {type: string, format: date-time}
    WorkspaceInput:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        base_currency:
          oneOf: [{$ref: "#/components/schemas/Currency"}, {type: "null"}]
        alert_min_score: {type: number, minimum: 0, maximum: 100}
        share_watch_terms: {type: boolean}
    Member:
      type: object
      required: [user, role, created_at]
      properties:
        user: {$ref: "#/components/schemas/User"}
        role: {$ref: "#/components/schemas/Role"}
        created_at: {type: string, format: date-time}

    # --- connections & sources ------------------------------------------------------------
    Provider:
      type: object
      required: [id, name, kind, available]
      properties:
        id: {type: string, description: "`google_sheets` or `composio:<app>`", examples: [google_sheets, "composio:airtable"]}
        name: {type: string, examples: [Google Sheets, Airtable]}
        kind: {type: string, enum: [direct, composio]}
        available: {type: boolean, description: false when the server lacks the credentials for it}
    ConnectionStatus:
      type: string
      enum: [pending, active, needs_reauth, error, revoked]
    Connection:
      type: object
      required: [id, provider, display_name, status, status_reason, account_label, source_count, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        provider: {type: string, examples: [google_sheets, "composio:airtable"]}
        display_name: {type: string}
        status: {$ref: "#/components/schemas/ConnectionStatus"}
        status_reason: {type: [string, "null"]}
        account_label: {type: [string, "null"], description: e.g. the Google account email}
        source_count: {type: integer, minimum: 0}
        watch:
          description: Drive push channel (google_sheets only)
          oneOf:
            - type: "null"
            - type: object
              required: [expires_at, renew_after]
              properties:
                expires_at: {type: string, format: date-time}
                renew_after: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    GooglePickerToken:
      type: object
      required: [access_token, expires_at, developer_key, app_id, scope]
      properties:
        access_token: {type: string}
        expires_at: {type: string, format: date-time}
        developer_key: {type: string, description: "Browser API key for the Picker (public, HTTP-referrer restricted)"}
        app_id: {type: string, description: Google Cloud project number}
        scope: {type: string, enum: ["https://www.googleapis.com/auth/drive.file"]}
    SourceColumn:
      type: object
      required: [index, name, samples]
      properties:
        index: {type: integer, minimum: 0}
        name: {type: string}
        samples:
          type: array
          maxItems: 5
          items: {type: string}
    SourceStatus:
      type: string
      enum: [new, mapping_suggested, active, paused, error]
    Source:
      type: object
      required: [id, connection_id, kind, external_id, external_table_id, name, url, status, status_reason, header_row, columns, row_count, entity_count, last_synced_at, last_change_at, created_at]
      properties:
        id: {type: string, format: uuid}
        connection_id: {type: string, format: uuid}
        kind: {type: string, enum: [google_sheet, composio_table]}
        external_id: {type: string}
        external_table_id: {type: string}
        name: {type: string}
        url: {type: [string, "null"], format: uri}
        status: {$ref: "#/components/schemas/SourceStatus"}
        status_reason: {type: [string, "null"]}
        header_row: {type: integer}
        columns:
          type: array
          items: {$ref: "#/components/schemas/SourceColumn"}
        row_count: {type: [integer, "null"]}
        entity_count: {type: integer, minimum: 0}
        last_synced_at: {type: [string, "null"], format: date-time}
        last_change_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}

    MappingField:
      type: string
      description: |
        Where a column's values go. Normalisation (same rules as `jobs/codes.py`):
        `country`/`countries` accept names, alpha-2 or alpha-3 → alpha-3; `port`/`ports`
        accept UN/LOCODE with or without space; `currency` ISO 4217 codes only (symbols
        are *not* guessed in values); `spend_currency` may also come from the
        `annual_spend` column's header (`MappingSpec.columns[].currency`); `hs_code` digits only (2/4/6, dots removed);
        `software` purl or CPE 2.3; `annual_spend`/`revenue_share` numbers
        (`revenue_share` 0–1 or a percentage like "12%"); `criticality` low/medium/high/critical
        (case-insensitive; also 1–4); `kind` one of EntityKind (case-insensitive,
        singular or plural). Multi-value fields split on `split` (default `,;|`). A value
        that cannot be normalised is left out and reported in the preview/sync
        problems; it is never guessed.

        Where they are stored: `row_key` → `source_row_key`; `country`/`countries` →
        `countries`; `port`/`ports` → `ports`; for routes `route_origin_port` and
        `route_destination_port` → `ports` (origin first, destination last) and
        `via_chokepoints` (chokepoint ids or names) → `attrs.chokepoints`; `currency`/
        `currencies` → `currencies`; `hs_code` → `hs_codes`; `commodity` → `commodities`
        (lower case); `notes` → `attrs.notes`; exposure fields → the columns of the same name.
      enum:
        - name
        - kind
        - row_key
        - country
        - countries
        - city
        - address
        - lat
        - lon
        - port
        - ports
        - route_origin_port
        - route_destination_port
        - via_chokepoints
        - currency
        - currencies
        - hs_code
        - commodity
        - software
        - annual_spend
        - spend_currency
        - revenue_share
        - criticality
        - notes
        - ignore
    MappingFieldInfo:
      type: object
      required: [field, label, kinds, multi]
      properties:
        field: {$ref: "#/components/schemas/MappingField"}
        label: {type: string}
        kinds:
          type: array
          items: {$ref: "#/components/schemas/EntityKind"}
        multi: {type: boolean}
    MappingSpec:
      type: object
      description: |
        How rows become entities. Either every row has the same `entity_kind`, or a
        column is mapped to `kind`. Exactly one column may be `name` (required);
        `row_key` is optional (default: Airtable record id, or `row:<n>` for sheets,
        which is unstable when rows are inserted, so the UI should suggest a key column).
      required: [columns]
      properties:
        entity_kind:
          oneOf: [{$ref: "#/components/schemas/EntityKind"}, {type: "null"}]
        columns:
          type: array
          minItems: 1
          items:
            type: object
            required: [column, field]
            properties:
              column: {type: string, description: Header name exactly as in SourceColumn.name}
              field: {$ref: "#/components/schemas/MappingField"}
              split: {type: string, maxLength: 5, description: "Separator characters for multi-value fields"}
              currency: {type: string, pattern: "^[A-Z]{3}$", description: "`annual_spend` only: the spend currency for this column, read from its header (`Annual spend (USD)`, `Spend in EUR`, `Spend €`). Used when no `spend_currency` column has a value; without it, the server reads the header itself"}
              confidence: {type: number, minimum: 0, maximum: 1, description: "Suggestions only: the model's confidence"}
              reason: {type: string, maxLength: 200, description: "Suggestions only: one-line reason"}
    ColumnMapping:
      type: object
      required: [id, source_id, version, status, spec, model, created_at, confirmed_at]
      properties:
        id: {type: string, format: uuid}
        source_id: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        status: {type: string, enum: [suggested, confirmed, superseded, rejected]}
        spec: {$ref: "#/components/schemas/MappingSpec"}
        model: {type: [string, "null"], description: "`groq:<GROQ_MAPPING_MODEL>`, or `heuristic` when Groq was unavailable. On a confirmed version: the suggestion's model when it was confirmed unchanged, else null (mapped by hand)"}
        created_at: {type: string, format: date-time}
        confirmed_at: {type: [string, "null"], format: date-time}
    MappingPreview:
      type: object
      required: [rows_read, entities, problems]
      properties:
        rows_read: {type: integer}
        entities: {$ref: "#/components/schemas/EntityFeatureCollection"}
        problems:
          type: array
          items:
            type: object
            required: [row_number, column, value, message]
            properties:
              row_number: {type: integer}
              column: {type: string}
              value: {type: string, maxLength: 100}
              message: {type: string, examples: ["not a known country", "missing name"]}

    # --- entities --------------------------------------------------------------------------
    EntityKind:
      type: string
      enum: [supplier, site, customer, route, port, currency, commodity, software]
    Criticality:
      type: string
      enum: [low, medium, high, critical]
    Entity:
      type: object
      required: [id, kind, name, countries, ports, currencies, hs_codes, commodities, software, lat, lon, city, address, exposure, attrs, lineage, open_risk_count, max_score]
      properties:
        id: {type: string, format: uuid}
        kind: {$ref: "#/components/schemas/EntityKind"}
        name: {type: string}
        countries:
          type: array
          items: {$ref: "#/components/schemas/Country"}
        ports:
          type: array
          description: For routes, ordered origin → destination
          items: {$ref: "#/components/schemas/Locode"}
        currencies:
          type: array
          items: {$ref: "#/components/schemas/Currency"}
        hs_codes:
          type: array
          items: {type: string, pattern: "^[0-9]{2}([0-9]{2}([0-9]{2})?)?$"}
        commodities:
          type: array
          items: {type: string}
        software:
          type: array
          description: purl or CPE 2.3
          items: {type: string}
        lat: {type: [number, "null"], description: "The row's latitude; without one, the city's (GeoNames cities15000, matched within the row's countries); null when neither is known (the dashboard then places it by port or country)"}
        lon: {type: [number, "null"]}
        city: {type: [string, "null"]}
        place: {type: [string, "null"], description: "Where it is, in words: the city and country (`Hsinchu, Taiwan`) when it has a city, else the first port's display name and up to two countries (`Kaohsiung, Taiwan`, `Japan and China +1`)"}
        address: {type: [string, "null"]}
        exposure:
          type: object
          required: [annual_spend, spend_currency, revenue_share, criticality]
          properties:
            annual_spend: {type: [string, "null"], description: "Decimal as a string, e.g. \"125000.00\""}
            spend_currency:
              oneOf: [{$ref: "#/components/schemas/Currency"}, {type: "null"}]
            revenue_share: {type: [number, "null"], minimum: 0, maximum: 1}
            criticality:
              oneOf: [{$ref: "#/components/schemas/Criticality"}, {type: "null"}]
        attrs:
          type: object
          description: "Mapped extras: notes, and for routes `chokepoints` (ids)"
          additionalProperties: true
        lineage:
          type: object
          required: [source_id, source_name, row_key, row_number, mapping_version, synced_at]
          properties:
            source_id: {type: string, format: uuid}
            source_name: {type: string}
            row_key: {type: string}
            row_number: {type: [integer, "null"]}
            mapping_version: {type: integer}
            synced_at: {type: string, format: date-time}
            url: {type: [string, "null"], format: uri, description: Deep link to the row when the tool supports it}
        open_risk_count: {type: integer, minimum: 0}
        max_score: {type: [number, "null"], minimum: 0, maximum: 100}

    # --- risks ------------------------------------------------------------------------------
    RiskCategory:
      type: string
      enum: [natural_hazard, logistics, geopolitical, sanctions, trade_policy, cyber, financial, labour, other]
    RiskStatus:
      type: string
      enum: [open, acknowledged, mitigating, resolved, dismissed]
    Risk:
      type: object
      required: [id, entity, category, title, likelihood, impact, score, status, countries, ports, lat, lon, evidence_count, first_seen_at, last_seen_at, status_changed_at, story]
      properties:
        id: {type: string, format: uuid}
        entity:
          type: object
          required: [id, kind, name]
          properties:
            id: {type: string, format: uuid}
            kind: {$ref: "#/components/schemas/EntityKind"}
            name: {type: string}
            city: {type: [string, "null"], description: The entity's city}
        category: {$ref: "#/components/schemas/RiskCategory"}
        title: {type: string}
        likelihood: {type: number, minimum: 0, maximum: 1}
        impact: {type: number, minimum: 0, maximum: 1}
        score: {type: number, minimum: 0, maximum: 100, description: "100 × likelihood × impact, 1 decimal"}
        status: {$ref: "#/components/schemas/RiskStatus"}
        countries:
          type: array
          items: {$ref: "#/components/schemas/Country"}
        ports:
          type: array
          items: {$ref: "#/components/schemas/Locode"}
        lat: {type: [number, "null"]}
        lon: {type: [number, "null"]}
        place: {type: [string, "null"], description: "The entity's `place` when it has a city (`Hsinchu, Taiwan`), else the risk's first port and countries in words (`Kaohsiung, Taiwan`)"}
        evidence_count: {type: integer, minimum: 0}
        first_seen_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time}
        status_changed_at: {type: string, format: date-time}
        story:
          type: object
          description: |
            One feed item (a news report, a hazard, a listing) that reaches several entities is one
            *story*: the engine gives each of their risks the same key (`factors.story`,
            risk-engine.md §5.9). Counts and lists that should not repeat a story use it.
          required: [key, risk_count, entities]
          properties:
            key: {type: string, description: "`<category>|<evidence key of the strongest item>`, or `risk:<id>` for a risk scored before engine 1.2.0"}
            risk_count: {type: integer, minimum: 1, description: "Open, acknowledged or mitigating risks in this story (1 when only this one)"}
            entities:
              type: array
              maxItems: 10
              description: The entities the story reaches, highest score first
              items:
                type: object
                required: [id, name]
                properties:
                  id: {type: string, format: uuid}
                  name: {type: string}
    RiskDetail:
      allOf:
        - {$ref: "#/components/schemas/Risk"}
        - type: object
          required: [explanation, factors, advice, evidence, history, status_note, engine_version]
          properties:
            explanation: {type: string, description: "One plain sentence (engine 1.2.0); the numbers are in `factors.explain`"}
            factors: {$ref: "#/components/schemas/RiskFactors"}
            advice:
              oneOf:
                - type: "null"
                - type: object
                  required: [text, source, model, generated_at]
                  properties:
                    text: {type: string}
                    source: {type: string, enum: [groq, template]}
                    model: {type: [string, "null"]}
                    generated_at: {type: string, format: date-time}
            evidence:
              type: array
              description: Sorted by contribution, highest first
              items: {$ref: "#/components/schemas/Evidence"}
            history:
              type: array
              description: Oldest first, at most 200 points
              items:
                type: object
                required: [recorded_at, likelihood, impact, score, status, reason]
                properties:
                  recorded_at: {type: string, format: date-time}
                  likelihood: {type: number}
                  impact: {type: number}
                  score: {type: number}
                  status: {$ref: "#/components/schemas/RiskStatus"}
                  reason: {type: string, enum: [created, rescored, status_changed, resolved_by_engine, reopened]}
            status_note: {type: [string, "null"]}
            engine_version: {type: string}
    RiskFactors:
      type: object
      description: Exactly the `factors` jsonb the engine writes (risk-engine.md §3)
      required: [likelihood, impact, engine_version]
      properties:
        likelihood:
          type: object
          required: [method, value, items]
          properties:
            method: {type: string, enum: [noisy_or]}
            value: {type: number}
            capped_from: {type: number, description: "Present when a market-only risk was capped (risk-engine.md §5.9): the likelihood before the cap"}
            decay: {type: number, description: "Engine 1.3.0+: each further item (strongest first) counts this times the one before (risk-engine.md §5.6); absent means 1"}
            items:
              type: array
              items:
                type: object
                required: [evidence_key, signal, recency, match_confidence, contribution]
                properties:
                  evidence_key: {type: string}
                  signal: {type: number}
                  recency: {type: number}
                  match_confidence: {type: number}
                  contribution: {type: number}
                  weight: {type: number, description: "Engine 1.3.0+: decay^(rank−1), the share of this item's contribution that counts"}
        impact:
          type: object
          required: [value, criticality, criticality_weight, exposure_share, exposure_norm, category_multiplier]
          properties:
            value: {type: number}
            criticality:
              oneOf: [{$ref: "#/components/schemas/Criticality"}, {type: "null"}]
            criticality_weight: {type: number}
            exposure_share: {type: [number, "null"]}
            exposure_norm: {type: [number, "null"]}
            category_multiplier: {type: number}
        engine_version: {type: string}
        story: {type: string, description: "Engine 1.2.0+: the story key (`Risk.story.key`)"}
        explain:
          type: object
          description: |
            Engine 1.2.0+: the numbers behind the score, for the collapsed "How this was scored"
            section. Absent on risks not re-scored since then.
          required: [matched, strongest, item_count, steps]
          properties:
            matched:
              type: object
              required: [match_type, match_value, label, matched_text, inferred_from, supported_by]
              properties:
                match_type: {type: string}
                match_value: {type: string}
                label: {type: string, examples: ["country: China (CHN)"]}
                matched_text: {type: [string, "null"], description: "The text in the item that matched (tagged place or company, listed name)"}
                inferred_from: {type: [string, "null"], description: "Chokepoints only: `port TWKHH`, `country VNM` or `position` when the chokepoint was inferred, not declared on a route"}
                supported_by:
                  description: A commodity or HS-chapter match of the same item that strengthened this match
                  oneOf:
                    - type: "null"
                    - type: object
                      required: [match_type, match_value, matched_text, confidence]
                      properties:
                        match_type: {type: string}
                        match_value: {type: string, examples: ["HS 85"]}
                        matched_text: {type: [string, "null"]}
                        confidence: {type: number}
            strongest:
              type: object
              required: [evidence_key, title, source, published_at]
              properties:
                evidence_key: {type: string}
                title: {type: string}
                source: {type: string}
                published_at: {type: [string, "null"], format: date-time}
            item_count: {type: integer, minimum: 1}
            steps:
              type: array
              description: In order; the last is the score
              items:
                type: object
                required: [label, formula, value]
                properties:
                  label: {type: string, examples: ["Likelihood"]}
                  formula: {type: string, examples: ["noisy-OR of 2 items: 1 − (1 − 0.351) × (1 − 0.330) = 0.565"]}
                  value: {type: number}
    Evidence:
      type: object
      required: [evidence_key, kind, match_type, match_value, match_confidence, signal, recency, contribution, snapshot, still_in_feeds, last_linked_at]
      properties:
        evidence_key: {type: string, examples: ["event:usgs:us6000abcd"]}
        kind: {type: string, enum: [event, anomaly]}
        event:
          description: Present for kind=event
          type: object
          required: [source, raw_id]
          properties:
            source: {type: string}
            raw_id: {type: string}
        anomaly:
          description: Present for kind=anomaly
          type: object
          required: [series, key, ts, method]
          properties:
            series: {type: string}
            key: {type: string}
            ts: {type: string, format: date-time}
            method: {type: string, enum: [robust_z, isolation_forest]}
        match_type: {type: string, enum: [country, geo_radius, port, chokepoint, currency, commodity, software, sanctions_name, company_name]}
        match_value: {type: string}
        match_confidence: {type: number, minimum: 0, maximum: 1}
        signal: {type: number, minimum: 0, maximum: 1}
        recency: {type: number, minimum: 0, maximum: 1}
        contribution: {type: number, minimum: 0, maximum: 1}
        snapshot: {$ref: "#/components/schemas/EvidenceSnapshot"}
        still_in_feeds: {type: boolean, description: "false once feed retention removed the original row, or (full sanctions lists) the entity left the list"}
        last_linked_at: {type: string, format: date-time}
    EvidenceSnapshot:
      type: object
      required: [title]
      properties:
        title: {type: string}
        url: {type: [string, "null"]}
        type: {type: [string, "null"]}
        published_at: {type: [string, "null"], format: date-time}
        severity: {type: [number, "null"]}
        lat: {type: [number, "null"]}
        lon: {type: [number, "null"]}
        countries:
          type: array
          items: {type: string}
        ports:
          type: array
          items: {type: string}
        value: {type: [number, "null"]}
        baseline: {type: [number, "null"]}
        score: {type: [number, "null"]}
        unit: {type: [string, "null"]}
        inferred_from: {type: [string, "null"], description: "Chokepoint evidence of a supplier, site or port: what the chokepoint was inferred from (see `RiskFactors.explain`)"}
        supported_by: {type: [object, "null"], description: "The commodity match that strengthened this item's match, as in `RiskFactors.explain`"}
        central: {type: [string, "null"], enum: [title, first_place, null], description: "Engine 1.3.0+, country matches of news: why the country counts as central to the article (risk-engine.md §5.10)"}
    RiskSummary:
      type: object
      required: [open_count, story_count, by_category, stories_by_category, by_status, max_score, top, last_scored_at, feeds_as_of]
      properties:
        open_count: {type: integer, description: "open + acknowledged + mitigating"}
        story_count: {type: integer, description: "Distinct stories among those risks (`Risk.story.key`): what the Overview counts"}
        stories_by_category:
          type: object
          description: RiskCategory → distinct open stories (all categories present, 0 if none)
          additionalProperties: {type: integer}
        by_category:
          type: object
          description: RiskCategory → open count (all categories present, 0 if none)
          additionalProperties: {type: integer}
        by_status:
          type: object
          additionalProperties: {type: integer}
        max_score: {type: [number, "null"]}
        top:
          type: array
          maxItems: 5
          items: {$ref: "#/components/schemas/Risk"}
        last_scored_at: {type: [string, "null"], format: date-time}
        feeds_as_of: {type: [string, "null"], format: date-time, description: "max(feeds.source_health.last_success_at)"}

    # --- GeoJSON (RFC 7946) -----------------------------------------------------------------
    PointGeometry:
      type: object
      required: [type, coordinates]
      properties:
        type: {type: string, enum: [Point]}
        coordinates:
          type: array
          description: "[lon, lat]"
          minItems: 2
          maxItems: 2
          items: {type: number}
    EntityFeatureCollection:
      type: object
      required: [type, features, truncated]
      properties:
        type: {type: string, enum: [FeatureCollection]}
        truncated: {type: boolean}
        features:
          type: array
          items:
            type: object
            required: [type, id, geometry, properties]
            properties:
              type: {type: string, enum: [Feature]}
              id: {type: string, description: "Entity id; in a preview, `row:<n>`"}
              geometry:
                oneOf: [{$ref: "#/components/schemas/PointGeometry"}, {type: "null"}]
              properties:
                type: object
                required: [kind, name, countries, ports, criticality, open_risk_count, max_score]
                properties:
                  kind: {$ref: "#/components/schemas/EntityKind"}
                  name: {type: string}
                  countries:
                    type: array
                    items: {type: string}
                  ports:
                    type: array
                    items: {type: string}
                  city: {type: [string, "null"]}
                  place: {type: [string, "null"], description: "As `Entity.place`"}
                  criticality: {type: [string, "null"]}
                  open_risk_count: {type: integer}
                  max_score: {type: [number, "null"]}
                  row_number: {type: [integer, "null"], description: Preview only}
    RiskPlaceFeatureCollection:
      type: object
      required: [type, features]
      properties:
        type: {type: string, enum: [FeatureCollection]}
        features:
          type: array
          items:
            type: object
            required: [type, id, geometry, properties]
            properties:
              type: {type: string, enum: [Feature]}
              id: {type: string, description: "`country:JPN`, `port:NLRTM` or `point:<entity id>`"}
              geometry:
                oneOf: [{$ref: "#/components/schemas/PointGeometry"}, {type: "null"}]
              properties:
                type: object
                required: [place_type, place_key, risk_count, story_count, max_score, top_categories, top_risk_ids]
                properties:
                  place_type: {type: string, enum: [country, port, point]}
                  place_key: {type: string, description: "alpha-3, LOCODE or entity id"}
                  label: {type: [string, "null"], description: "The entity's name at a `point`, the port's display name at a `port` (`Kaohsiung`), null at a `country`"}
                  risk_count: {type: integer}
                  story_count: {type: integer, description: "Distinct stories at this place; `top_risk_ids` lists one risk per story"}
                  max_score: {type: number}
                  top_categories:
                    type: array
                    items: {$ref: "#/components/schemas/RiskCategory"}
                  top_risk_ids:
                    type: array
                    maxItems: 5
                    items: {type: string, format: uuid}
    FeedEventFeatureCollection:
      type: object
      required: [type, features, truncated]
      properties:
        type: {type: string, enum: [FeatureCollection]}
        truncated: {type: boolean}
        features:
          type: array
          items:
            type: object
            required: [type, id, geometry, properties]
            properties:
              type: {type: string, enum: [Feature]}
              id: {type: string, description: "`<source>:<raw_id>`"}
              geometry:
                oneOf: [{$ref: "#/components/schemas/PointGeometry"}, {type: "null"}]
              properties:
                type: object
                required: [source, raw_id, type, title, url, published_at, severity, countries, ports]
                properties:
                  source: {type: string}
                  raw_id: {type: string}
                  type: {type: string}
                  title: {type: string}
                  url: {type: [string, "null"]}
                  published_at: {type: [string, "null"], format: date-time}
                  severity: {type: [number, "null"]}
                  countries:
                    type: array
                    items: {type: string}
                  ports:
                    type: array
                    items: {type: string}
                  event_type:
                    oneOf: [{$ref: "#/components/schemas/TaggedEventType"}, {type: "null"}]
    DisruptionFeatureCollection:
      type: object
      required: [type, features]
      properties:
        type: {type: string, enum: [FeatureCollection]}
        features:
          type: array
          items:
            type: object
            required: [type, id, geometry, properties]
            properties:
              type: {type: string, enum: [Feature]}
              id: {type: string, description: "`chokepoint:<id>` or `portwatch:<raw_id>`"}
              geometry: {$ref: "#/components/schemas/PointGeometry"}
              properties:
                type: object
                required: [kind, name, status, severity, ports, countries, event_ids, since]
                properties:
                  kind: {type: string, enum: [chokepoint, port_disruption]}
                  name: {type: string}
                  status: {type: string, enum: [normal, watch, disrupted]}
                  severity: {type: [number, "null"]}
                  radius_km: {type: [number, "null"], description: Chokepoints only}
                  ports:
                    type: array
                    items: {type: string}
                  countries:
                    type: array
                    items: {type: string}
                  event_ids:
                    type: array
                    description: "`<source>:<raw_id>` of matching events"
                    items: {type: string}
                  since: {type: [string, "null"], format: date-time}

    # --- feeds --------------------------------------------------------------------------------
    TaggedEventType:
      type: string
      enum: [conflict, protest, sanctions, trade_policy, port_shipping_disruption, natural_hazard, cyber_incident, labour_action, financial_stress, other]
    FeedEvent:
      type: object
      description: A `feeds.events` row (see feeds-schema.md), plus its newest tag
      required: [source, raw_id, type, title, url, published_at, countries, ports, commodities, currencies, software, severity, lat, lon, attrs, first_seen_at, updated_at, tag]
      properties:
        source: {type: string}
        raw_id: {type: string}
        type: {type: string}
        title: {type: string}
        url: {type: [string, "null"]}
        published_at: {type: [string, "null"], format: date-time}
        countries:
          type: array
          items: {type: string}
        ports:
          type: array
          items: {type: string}
        commodities:
          type: array
          items: {type: string}
        currencies:
          type: array
          items: {type: string}
        software:
          type: array
          items: {type: string}
        severity: {type: [number, "null"]}
        lat: {type: [number, "null"]}
        lon: {type: [number, "null"]}
        attrs: {type: object, additionalProperties: true}
        first_seen_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        tag:
          oneOf:
            - type: "null"
            - type: object
              required: [event_type, type_confidence, type_source, entities, model]
              properties:
                event_type: {$ref: "#/components/schemas/TaggedEventType"}
                type_confidence: {type: [number, "null"]}
                type_source: {type: string, enum: [model, source]}
                entities: {type: object, additionalProperties: true}
                model: {type: string}
    Anomaly:
      type: object
      required: [series, key, ts, method, value, baseline, score, attrs, detected_at]
      properties:
        series: {type: string}
        key: {type: string}
        ts: {type: string, format: date-time}
        method: {type: string, enum: [robust_z, isolation_forest]}
        value: {type: number}
        baseline: {type: number}
        score: {type: number}
        attrs: {type: object, additionalProperties: true}
        detected_at: {type: string, format: date-time}
    SourceHealth:
      type: object
      required: [source, status, last_run_at, last_success_at, consecutive_failures, records_last_run]
      properties:
        source: {type: string}
        status: {type: string, enum: [ok, empty, partial, throttled, error, skipped]}
        last_run_at: {type: string, format: date-time}
        last_success_at: {type: [string, "null"], format: date-time}
        last_error: {type: [string, "null"]}
        consecutive_failures: {type: integer}
        records_last_run: {type: integer}

    # --- scenarios -----------------------------------------------------------------------------
    ScenarioInputs:
      type: object
      description: At least one of `shocks` or `entity_overrides`.
      properties:
        shocks:
          type: array
          maxItems: 20
          items:
            oneOf:
              - {$ref: "#/components/schemas/HazardShock"}
              - {$ref: "#/components/schemas/FxShock"}
              - {$ref: "#/components/schemas/SanctionsShock"}
            discriminator:
              propertyName: type
              mapping:
                event: "#/components/schemas/HazardShock"
                fx: "#/components/schemas/FxShock"
                sanction: "#/components/schemas/SanctionsShock"
        entity_overrides:
          type: array
          maxItems: 200
          items:
            type: object
            required: [entity_id]
            properties:
              entity_id: {type: string, format: uuid}
              exclude: {type: boolean, description: "e.g. dropping a supplier"}
              criticality: {$ref: "#/components/schemas/Criticality"}
              annual_spend: {type: string, description: Decimal as a string}
              revenue_share: {type: number, minimum: 0, maximum: 1}
              countries:
                type: array
                items: {$ref: "#/components/schemas/Country"}
    HazardShock:
      type: object
      description: "A hypothetical event, run through the normal match rules as source `scenario`"
      required: [type, category, severity]
      properties:
        type: {type: string, enum: [event]}
        category: {$ref: "#/components/schemas/RiskCategory"}
        severity: {type: number, minimum: 0, maximum: 1}
        label: {type: string, maxLength: 200}
        countries:
          type: array
          items: {$ref: "#/components/schemas/Country"}
        ports:
          type: array
          items: {$ref: "#/components/schemas/Locode"}
        chokepoints:
          type: array
          items: {type: string, description: chokepoint id}
        lat: {type: number, minimum: -90, maximum: 90}
        lon: {type: number, minimum: -180, maximum: 180}
        radius_km: {type: number, minimum: 1, maximum: 2000}
    FxShock:
      type: object
      description: "A move of `currency` against `base_currency` (default: the workspace's)"
      required: [type, currency, pct_change]
      properties:
        type: {type: string, enum: [fx]}
        currency: {$ref: "#/components/schemas/Currency"}
        base_currency: {$ref: "#/components/schemas/Currency"}
        pct_change: {type: number, minimum: -90, maximum: 500}
    SanctionsShock:
      type: object
      description: Treat an entity as newly designated
      required: [type, entity_id]
      properties:
        type: {type: string, enum: [sanction]}
        entity_id: {type: string, format: uuid}
    ScenarioSide:
      type: object
      required: [risk_count, max_score, portfolio_score, by_category]
      properties:
        risk_count: {type: integer, description: "Risks (one per entity and story) on this side"}
        story_count:
          type: integer
          description: |
            Distinct stories on this side (as `Risk.story.key`: the engine's `factors.story`, else
            the risk itself). The headline count. Results stored before it was added lack it
            (show `risk_count` then).
        max_score: {type: [number, "null"]}
        portfolio_score:
          type: number
          minimum: 0
          maximum: 100
          description: |
            The risk index (risk-engine.md §12), rounded to 0.1. Per entity, its *exposure*: in
            each category c, its risks' scores sorted high to low, s_1 ≥ s_2 ≥ …, give
            `C_c = 100 × (1 − Π_k (1 − s_k/100)^(2^−(k−1)))` (the highest in full, the next at half
            weight, then a quarter, …); then `E = 100 × (1 − Π_c (1 − C_c/100))`. The index is the
            criticality-weighted mean of `E` over all the side's entities (an entity no risk
            touches counts as 0), so it is never above `most_exposed.exposure`, and a scenario
            that adds or raises any risk (and lowers none) raises it. Results stored before
            `most_exposed` was added used the worst score per category for `C_c`.
        most_exposed:
          description: |
            The entity with the highest exposure `E` on this side; null when no risk touches any
            entity. The index is never above its `exposure`. Absent in older stored results.
          oneOf:
            - {type: "null"}
            - type: object
              required: [entity_id, entity_name, exposure, risk_count]
              properties:
                entity_id: {type: string, format: uuid}
                entity_name: {type: string}
                exposure: {type: number, minimum: 0, maximum: 100}
                risk_count: {type: integer, description: "That entity's risks on this side"}
        by_category:
          type: object
          additionalProperties: {type: integer}
    ScenarioResults:
      type: object
      required: [baseline, scenario, changes, engine_version, as_of]
      properties:
        baseline: {$ref: "#/components/schemas/ScenarioSide"}
        scenario: {$ref: "#/components/schemas/ScenarioSide"}
        changes:
          type: array
          description: Risks whose score differs, largest absolute delta first (at most 200)
          items:
            type: object
            required: [fingerprint, entity_id, entity_name, category, title, baseline_score, scenario_score, delta]
            properties:
              fingerprint: {type: string}
              risk_id: {type: [string, "null"], format: uuid, description: "Existing risk, if any"}
              entity_id: {type: string, format: uuid}
              entity_name: {type: string}
              category: {$ref: "#/components/schemas/RiskCategory"}
              title: {type: string}
              baseline_score: {type: [number, "null"]}
              scenario_score: {type: [number, "null"]}
              delta: {type: number}
              lat: {type: [number, "null"]}
              lon: {type: [number, "null"]}
              countries:
                type: array
                items: {type: string}
        engine_version: {type: string}
        as_of: {type: string, format: date-time}
    ScenarioSummary:
      type: object
      required: [id, name, description, status, created_at, completed_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        description: {type: [string, "null"]}
        status: {type: string, enum: [running, completed, failed]}
        created_at: {type: string, format: date-time}
        completed_at: {type: [string, "null"], format: date-time}
    Scenario:
      allOf:
        - {$ref: "#/components/schemas/ScenarioSummary"}
        - type: object
          required: [inputs, results, error]
          properties:
            inputs: {$ref: "#/components/schemas/ScenarioInputs"}
            results:
              oneOf: [{$ref: "#/components/schemas/ScenarioResults"}, {type: "null"}]
            error: {type: [string, "null"]}

    # --- alerts --------------------------------------------------------------------------------
    Alert:
      type: object
      required: [id, kind, severity, title, body, risk_id, connection_id, created_at, read_at]
      properties:
        id: {type: string, format: uuid}
        kind:
          type: string
          enum: [risk_new, risk_escalated, sanctions_match, connection_error, source_sync_failed]
          description: |
            `sanctions_match` ("Possible sanctions match") only for a sanctions-list name match
            (rule `sanctions_name`); sanctions news about a country is `risk_new`/`risk_escalated`.
        severity: {type: string, enum: [info, warning, critical]}
        title: {type: string}
        body: {type: string}
        risk_id: {type: [string, "null"], format: uuid}
        connection_id: {type: [string, "null"], format: uuid}
        created_at: {type: string, format: date-time}
        read_at: {type: [string, "null"], format: date-time}
        risk_status:
          description: |
            The current status of the alert's risk; null when it has none (or in the
            `alert.created` live event). An alert whose risk is resolved or dismissed is marked
            read (by the worker's next scoring pass, or when a user dismisses the risk).
          oneOf: [{$ref: "#/components/schemas/RiskStatus"}, {type: "null"}]

    # --- live updates -----------------------------------------------------------------------------
    StreamEventName:
      type: string
      enum: [risk.created, risk.updated, risk.resolved, alert.created, source.sync_started, source.synced, source.sync_failed, mapping.suggested, connection.updated, feeds.updated, resync]
    RiskEvent:
      type: object
      required: [risk]
      properties:
        risk: {$ref: "#/components/schemas/Risk"}
        previous_score: {type: [number, "null"]}
    SourceEvent:
      type: object
      required: [source_id, status]
      properties:
        source_id: {type: string, format: uuid}
        status: {$ref: "#/components/schemas/SourceStatus"}
        entities_upserted: {type: integer}
        entities_deleted: {type: integer}
        problems: {type: integer, description: Rows/values that could not be normalised}
        error: {type: [string, "null"]}
    MappingEvent:
      type: object
      required: [source_id, mapping_id, version]
      properties:
        source_id: {type: string, format: uuid}
        mapping_id: {type: string, format: uuid}
        version: {type: integer}
    ConnectionEvent:
      type: object
      required: [connection_id, status]
      properties:
        connection_id: {type: string, format: uuid}
        status: {$ref: "#/components/schemas/ConnectionStatus"}
        status_reason: {type: [string, "null"]}
    FeedsUpdatedEvent:
      type: object
      required: [as_of, sources]
      properties:
        as_of: {type: string, format: date-time}
        sources:
          type: array
          description: Sources whose last_run_at advanced
          items: {type: string}
    EventPage:
      type: object
      required: [items, next, more, resync]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/StreamEvent"}
        next: {type: integer, description: "The cursor for the next call (`after`)"}
        more: {type: boolean, description: "More events are waiting: call again at once"}
        resync: {type: boolean, description: "The cursor was too old: refetch, then continue from `next`"}
    StreamEvent:
      type: object
      description: "One live update: `id`, `event` and `data` (the schema for that event)"
      required: [id, event, data, created_at]
      properties:
        id: {type: integer}
        created_at: {type: string, format: date-time}
        event: {$ref: "#/components/schemas/StreamEventName"}
        data:
          oneOf:
            - {$ref: "#/components/schemas/RiskEvent"}
            - {$ref: "#/components/schemas/Alert"}
            - {$ref: "#/components/schemas/SourceEvent"}
            - {$ref: "#/components/schemas/MappingEvent"}
            - {$ref: "#/components/schemas/ConnectionEvent"}
            - {$ref: "#/components/schemas/FeedsUpdatedEvent"}
            - {type: object, maxProperties: 0, description: resync}
