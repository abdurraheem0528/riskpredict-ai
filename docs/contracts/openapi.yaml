openapi: 3.1.0
info:
  title: RiskPredict AI API
  version: 0.1.0
  summary: Business data, risks and map layers for the RiskPredict dashboard.
  description: |
    Contract between the FastAPI service (`api/`, session B) and the dashboard
    (`web/`, session D). The risk engine (session C) is described in
    `risk-engine.md`, and the public feed tables in `feeds-schema.md`.

    ## Conventions (defined once, apply everywhere)

    * **Base URL**: `https://<api host>/v1`; JSON only (`application/json`) except
      map layers (`application/geo+json`).
    * **Auth**: `Authorization: Bearer <access token>` on every endpoint except
      sign-up, sign-in, refresh, the OAuth callbacks, `/v1/health` and the inbound
      webhooks. Access tokens are JWTs (HS256), valid for 15 minutes. Refresh tokens
      are opaque, valid for 30 days, rotated on every use, and kept by the web app
      (not in a cookie: the API and the dashboard are on different sites).
    * **Workspace**: endpoints marked with the `X-Workspace-Id` header act on that
      workspace. The API checks the caller's membership, then sets
      `app.workspace_id` / `app.user_id` for the transaction, so row-level security
      applies too. A missing header is `400 workspace_required`; a workspace the
      caller is not a member of is `404 not_found` (not 403, so ids don't leak).
    * **Roles**: `viewer` can read; `editor` can also change sources, mappings,
      risks' status, scenarios and alerts; `admin` can also manage connections and
      members; `owner` can also delete the workspace. Too low a role is
      `403 forbidden`.
    * **Errors**: always `application/problem+json` (RFC 9457) with a stable
      machine-readable `code` (see `Problem`).
    * **Pagination**: lists take `limit` (1–200, default 50) and an opaque `cursor`.
      They return `{"items": [...], "next_cursor": "..." | null}`. Order is stable.
      Cursors stay valid for 24 hours.
    * **Ids** are UUIDs, except feed events (`source` + `raw_id`). Times are RFC 3339
      in UTC (`2026-11-24T12:00:00Z`). Country codes are ISO 3166-1 alpha-3, ports
      UN/LOCODE (5 characters, no space), currencies ISO 4217.
    * **Rate limits**: `429 rate_limited` with `Retry-After`. Sign-in is limited per
      IP and per account. Counters are shared by every API instance (in the database).
    * **Live updates**: the dashboard polls `GET /v1/events` about every 15 s while its
      tab is visible (there is no stream; the API runs serverless).
    * **No demo data**: every list is empty for a new workspace, and the dashboard
      must render the empty states, not placeholders.

    ## Dashboard screens → endpoints

    | Screen | Data |
    |---|---|
    | **Empty** (no connections yet) | `GET /v1/me`, `GET /v1/connections` (empty list), `GET /v1/feeds/health`, `GET /v1/map/events` (the live world map still works) |
    | **Connect** (pick a tool) | `GET /v1/connections/providers`, `POST /v1/connections/google/start` → Google consent → `GET /v1/connections/google/callback` → `POST /v1/connections/{id}/google/picker-token` → Google Picker → `POST /v1/sources`; or `POST /v1/connections/composio` → hosted auth → `GET /v1/connections/{id}/browse` → `POST /v1/sources` |
    | **Confirm** (review the AI's column mapping on the map) | `GET /v1/sources/{id}` (columns + samples), `POST /v1/sources/{id}/mapping/suggest`, `GET /v1/sources/{id}/mapping`, `POST /v1/sources/{id}/mapping/preview` (GeoJSON of would-be entities + row problems), `POST /v1/sources/{id}/mapping/confirm`; events `mapping.suggested`, `source.synced` |
    | **Main** (full-screen map with risks, sheet of top risks) | `GET /v1/map/entities`, `GET /v1/map/risks`, `GET /v1/map/events`, `GET /v1/map/disruptions`, `GET /v1/risks/summary`, `GET /v1/risks?sort=-score`, `GET /v1/alerts?unread=true`; events `risk.*`, `alert.created`, `feeds.updated` |
    | **Risk** (one risk with evidence and advice) | `GET /v1/risks/{id}` (evidence, factors, history, advice), `GET /v1/feeds/series` (chart for anomaly evidence), `PATCH /v1/risks/{id}` |
    | **Scenario** (what-if) | `POST /v1/scenarios`, `GET /v1/scenarios`, `GET /v1/scenarios/{id}`, `GET /v1/entities` (to pick overrides) |
servers:
  - url: http://localhost:8000
    description: Local (`docker compose up`)
security:
  - bearerAuth: []
tags:
  - name: auth
    description: "Sign-up, sign-in, refresh tokens (own accounts, argon2id)"
  - name: workspaces
    description: "Workspaces, settings and members"
  - name: connections
    description: "Connected tools: Google Sheets directly, others via Composio"
  - name: sources
    description: "Connected sheets/tables and their column mapping"
  - name: entities
    description: "The business's suppliers, sites, customers, routes, ports, currencies, commodities and software"
  - name: risks
    description: "Scored risks (score = 100 × likelihood × impact) with evidence"
  - name: map
    description: "GeoJSON layers for the MapLibre dashboard"
  - name: feeds
    description: "Read-only public feed data"
  - name: scenarios
    description: "What-if runs of the risk engine"
  - name: alerts
    description: "In-app alerts"
  - name: events
    description: "Live updates, polled"
  - name: webhooks
    description: "Inbound notifications from Google Drive and Composio"
  - name: system
    description: "Health"

paths:
  /v1/health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness, plus the latest applied migration (read once at startup)
      description: Never queries the database, so health checks do not wake Neon. `schema_version` is `unknown` until this API instance has served a request that used the database (serverless instances are short-lived). While `EXPECTED_SCHEMA_VERSION` (default `050_serverless_state`) is not applied, requests that use the database answer `503`.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status, version, schema_version]
                properties:
                  status: {type: string, enum: [ok]}
                  version: {type: string, description: API build version}
                  schema_version: {type: string, description: "latest applied migration, e.g. 007_biz_lookups"}

  # --- auth ------------------------------------------------------------------
  /v1/auth/sign-up:
    post:
      tags: [auth]
      operationId: signUp
      summary: Create an account and its first workspace (caller becomes owner)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, workspace_name]
              properties:
                email: {type: string, format: email, maxLength: 254}
                password: {type: string, minLength: 12, maxLength: 128, description: "Hashed with argon2id (m=19456 KiB, t=2, p=1); never logged"}
                display_name: {type: string, maxLength: 120}
                workspace_name: {type: string, minLength: 1, maxLength: 120}
      responses:
        "201":
          description: Signed up and signed in
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "429": {$ref: "#/components/responses/RateLimited"}

  /v1/auth/sign-in:
    post:
      tags: [auth]
      operationId: signIn
      summary: Exchange email and password for tokens
      description: Wrong email and wrong password give the same `401 invalid_credentials` (and take the same time). Ten failures in a row lock the account for 15 minutes (`401 account_locked`, also with the right password). Rate limits are 20 attempts a minute per IP and 10 per account (`429`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string, maxLength: 128}
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthResult"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "429": {$ref: "#/components/responses/RateLimited"}

  /v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshTokens
      summary: Rotate the refresh token and get a new access token
      description: Each refresh token works once. Presenting an already-rotated token revokes its whole family (all devices signed in from that sign-in) and returns `401 refresh_reused`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: {type: string}
      responses:
        "200":
          description: New tokens
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Tokens"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /v1/auth/sign-out:
    post:
      tags: [auth]
      operationId: signOut
      summary: Revoke the refresh token's family
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: {type: string}
                everywhere: {type: boolean, default: false, description: Revoke every session of this user}
      responses:
        "204": {description: Signed out (also when the token was already invalid)}
        "400": {$ref: "#/components/responses/BadRequest"}

  /v1/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: The signed-in user and their workspaces
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [user, memberships]
                properties:
                  user: {$ref: "#/components/schemas/User"}
                  memberships:
                    type: array
                    items:
                      type: object
                      required: [workspace, role]
                      properties:
                        workspace: {$ref: "#/components/schemas/Workspace"}
                        role: {$ref: "#/components/schemas/Role"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    patch:
      tags: [auth]
      operationId: updateMe
      summary: Change display name or password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: {type: string, maxLength: 120}
                current_password: {type: string, description: Required with new_password}
                new_password: {type: string, minLength: 12, maxLength: 128, description: Changing it revokes every other session}
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "422": {$ref: "#/components/responses/Unprocessable"}

  # --- workspaces ----------------------------------------------------------------
  /v1/workspaces:
    get:
      tags: [workspaces]
      operationId: listWorkspaces
      summary: Workspaces the caller belongs to
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Workspace"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    post:
      tags: [workspaces]
      operationId: createWorkspace
      summary: Create another workspace (caller becomes owner)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WorkspaceInput"}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Workspace"}
        "422": {$ref: "#/components/responses/Unprocessable"}

  /v1/workspaces/{workspace_id}:
    parameters:
      - {$ref: "#/components/parameters/WorkspaceIdPath"}
    get:
      tags: [workspaces]
      operationId: getWorkspace
      summary: One workspace
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Workspace"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      tags: [workspaces]
      operationId: updateWorkspace
      summary: Rename or change settings (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WorkspaceInput"}
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Workspace"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [workspaces]
      operationId: deleteWorkspace
      summary: Delete the workspace and everything in it (owner)
      description: Revokes Google tokens and Drive channels, deletes Composio connected accounts, then deletes all rows (cascade). Cannot be undone.
      responses:
        "204": {description: Deleted}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /v1/workspaces/{workspace_id}/members:
    parameters:
      - {$ref: "#/components/parameters/WorkspaceIdPath"}
    get:
      tags: [workspaces]
      operationId: listMembers
      summary: Members of the workspace
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Member"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    post:
      tags: [workspaces]
      operationId: addMember
      summary: Add an existing account by email (admin)
      description: There is no email service, so only people who already signed up can be added. An unknown email is `404 not_found`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: {type: string, format: email}
                role: {$ref: "#/components/schemas/Role"}
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Member"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}

  /v1/workspaces/{workspace_id}/members/{user_id}:
    parameters:
      - {$ref: "#/components/parameters/WorkspaceIdPath"}
      - name: user_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    patch:
      tags: [workspaces]
      operationId: updateMember
      summary: Change a member's role (admin; only an owner can make or unmake owners)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: {$ref: "#/components/schemas/Role"}
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Member"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
    delete:
      tags: [workspaces]
      operationId: removeMember
      summary: Remove a member, or leave (yourself). The last owner cannot leave (409).
      responses:
        "204": {description: Removed}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}

  # --- connections -----------------------------------------------------------------
  /v1/connections/providers:
    get:
      tags: [connections]
      operationId: listProviders
      summary: Tools that can be connected (Connect screen)
      description: Google Sheets is direct (`available` when the Google OAuth client and `TOKEN_ENCRYPTION_KEYS` are configured). Others go through Composio and are listed only when `COMPOSIO_API_KEY` is configured, and only for tools the API can read rows from (currently Airtable); one is `available` when `COMPOSIO_AUTH_CONFIGS` has an auth config for it.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Provider"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /v1/connections:
    get:
      tags: [connections]
      operationId: listConnections
      summary: The workspace's connections (empty list = Empty screen)
      parameters:
        - {$ref: "#/components/parameters/WorkspaceHeader"}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Connection"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /v1/connections/google/start:
    post:
      tags: [connections]
      operationId: startGoogleConnection
      summary: Begin Google OAuth for Sheets (admin)
      description: |
        Creates a `pending` connection and returns Google's consent URL
        (scope `https://www.googleapis.com/auth/drive.file`, `access_type=offline`,
        `prompt=consent`, PKCE S256). The browser navigates to it; Google redirects to
        `GET /v1/connections/google/callback`, which redirects back to the dashboard.
      parameters:
        - {$ref: "#/components/parameters/WorkspaceHeader"}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                return_path: {type: string, default: /connect, pattern: "^/[A-Za-z0-9/_-]*$", description: Dashboard path to return to}
      responses:
        "201":
          description: Consent URL
          content:
            application/json:
              schema:
                type: object
                required: [connection_id, authorization_url]
                properties:
                  connection_id: {type: string, format: uuid}
                  authorization_url: {type: string, format: uri}
        "403": {$ref: "#/components/responses/Forbidden"}
        "503": {$ref: "#/components/responses/Unavailable"}

  /v1/connections/google/callback:
    get:
      tags: [connections]
      operationId: googleCallback
      summary: Google redirects here; the API redirects to the dashboard
      description: |
        Verifies `state` (sha256 stored in `biz.connections.oauth_state_hash`), exchanges
        the code, encrypts the refresh token (AES-256-GCM) and marks the connection
        `active`. Then redirects (302) to
        `${WEB_ORIGIN}<return_path>?connection_id=<id>&status=ok|error&code=<problem code>`.
      security: []
      parameters:
        - {name: code, in: query, schema: {type: string}}
        - {name: state, in: query, required: true, schema: {type: string}}
        - {name: error, in: query, schema: {type: string}}
      responses:
        "302": {description: Redirect to the dashboard}
        "400": {$ref: "#/components/responses/BadRequest"}

  /v1/connections/{connection_id}/google/picker-token:
    post:
      tags: [connections]
      operationId: getGooglePickerToken
      summary: Short-lived credentials for the Google Picker in the browser
      description: The access token is scoped to `drive.file` and lives at most 1 hour. Files the user picks become readable by the API.
      parameters:
        - {$ref: "#/components/parameters/WorkspaceHeader"}
        - {$ref: "#/components/parameters/ConnectionIdPath"}
      responses:
        "200":
          description: Picker credentials
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GooglePickerToken"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}

  /v1/connections/composio:
    post:
      tags: [connections]
      operationId: startComposioConnection
      summary: Get a Composio hosted-auth link for another tool (admin)
      description: |
        Creates a `pending` `composio:<app>` connection and returns Composio's
        redirect URL. Composio uses `ws_<workspace id>` as its user id. After auth,
        Composio redirects to `${WEB_ORIGIN}/connect?connection_id=<id>`; the dashboard
        then polls `GET /v1/connections/{id}` (or waits for the event `connection.updated`)
        until it is `active`.
      parameters:
        - {$ref: "#/components/parameters/WorkspaceHeader"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [app]
              properties:
                app: {type: string, pattern: "^[a-z0-9_]{1,60}$", examples: [airtable]}
      responses:
        "201":
          description: Link created
          content:
            application/json:
              schema:
                type: object
                required: [connection_id, redirect_url]
                properties:
                  connection_id: {type: string, format: uuid}
                  redirect_url: {type: string, format: uri}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "503": {$ref: "#/components/responses/Unavailable"}

  /v1/connections/{connection_id}:
    parameters:
      - {$ref: "#/components/parameters/WorkspaceHeader"}
      - {$ref: "#/components/parameters/ConnectionIdPath"}
    get:
      tags: [connections]
      operationId: getConnection
      summary: One connection (a pending Composio one is re-checked with Composio)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Connection"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [connections]
      operationId: deleteConnection
      summary: Disconnect (admin)
      description: Revokes the Google token and stops the Drive channel, or deletes the Composio connected account; then deletes its sources, entities and risks.
      responses:
        "204": {description: Deleted}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /v1/connections/{connection_id}/browse:
    get:
      tags: [connections]
      operationId: browseConnection
      summary: List bases/tables in a Composio connection (Google uses the Picker instead)
      parameters:
        - {$ref: "#/components/parameters/WorkspaceHeader"}
        - {$ref: "#/components/parameters/ConnectionIdPath"}
        - {name: parent_id, in: query, description: "Omit for top level (e.g. Airtable bases); a base id lists its tables", schema: {type: string}}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, name, kind, selectable]
                      properties:
                        id: {type: string}
                        name: {type: string}
                        kind: {type: string, enum: [base, table]}
                        selectable: {type: boolean, description: true when it can become a source}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}

  # --- sources & column mapping -------------------------------------------------------
  /v1/sources:
    get:
      tags: [sources]
      operationId: listSources
      summary: List sources
      parameters:
        - {$ref: "#/components/parameters/WorkspaceHeader"}
        - {name: connection_id, in: query, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Source"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    post:
      tags: [sources]
      operationId: createSource
      summary: Add a picked sheet tab or table (editor)
      description: Reads the header row and up to 5 sample values per column (from the first 200 rows), stores them in `columns`, and makes a mapping suggestion before answering (Groq, else heuristics; event `mapping.suggested`), so a new source usually comes back as `mapping_suggested`. A Google spreadsheet the user did not pick with the Picker is `404`; an inactive connection is `409 connection_not_active`.
      parameters:
        - {$ref: "#/components/parameters/WorkspaceHeader"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [connection_id, external_id]
              properties:
                connection_id: {type: string, format: uuid}
                external_id: {type: string, description: "Google spreadsheet id, or Composio base id"}
                external_table_id: {type: string, default: "", description: "Sheet gid (\"\" = first tab), or table id"}
                header_row: {type: integer, minimum: 1, default: 1}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Source"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}

  /v1/sources/{source_id}:
    parameters:
      - {$ref: "#/components/parameters/WorkspaceHeader"}
      - {$ref: "#/components/parameters/SourceIdPath"}
    get:
      tags: [sources]
      operationId: getSource
      summary: Get source
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Source"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      tags: [sources]
      operationId: updateSource
      summary: Pause/resume syncing or change the header row (editor)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                paused: {type: boolean}
                header_row: {type: integer, minimum: 1}
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Source"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    delete:
      tags: [sources]
      operationId: deleteSource
      summary: Remove the source with its entities and risks (editor)
      responses:
        "204": {description: Deleted}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /v1/sources/{source_id}/sync:
    post:
      tags: [sources]
      operationId: syncSource
      summary: Re-read the source now (editor)
      parameters:
        - {$ref: "#/components/parameters/WorkspaceHeader"}
        - {$ref: "#/components/parameters/SourceIdPath"}
      responses:
        "202": {description: "Synced and scored within the request (a source in `error` goes back to `active`); the events `source.sync_started`, then `source.synced` or `source.sync_failed`, and any `risk.*` are written before the answer. Work cut short by the time budget is finished by the next worker run."}
        "409": {$ref: "#/components/responses/Conflict"}

  /v1/sources/{source_id}/mapping:
    get:
      tags: [sources]
      operationId: getMapping
      summary: Latest suggestion and the confirmed mapping (either may be null)
      parameters:
        - {$ref: "#/components/parameters/WorkspaceHeader"}
        - {$ref: "#/components/parameters/SourceIdPath"}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [suggested, confirmed, fields]
                properties:
                  suggested:
                    oneOf: [{$ref: "#/components/schemas/ColumnMapping"}, {type: "null"}]
                  confirmed:
                    oneOf: [{$ref: "#/components/schemas/ColumnMapping"}, {type: "null"}]
                  fields:
                    type: array
                    description: Target fields the UI can offer, with which entity kinds use them
                    items: {$ref: "#/components/schemas/MappingFieldInfo"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /v1/sources/{source_id}/mapping/suggest:
    post:
      tags: [sources]
      operationId: suggestMapping
      summary: Ask Groq for a column mapping (editor)
      description: |
        Sends only the header names and up to 5 sample values per column to Groq
        (`GROQ_MAPPING_MODEL`). The model's JSON is validated against `MappingSpec`;
        anything invalid is dropped, and columns the model skipped get the header
        heuristics' suggestion. This never writes entities. If Groq is not configured,
        unavailable or out of quota, the suggestion comes from deterministic header and
        sample heuristics alone (`model` = `heuristic`); the user confirms either way.
      parameters:
        - {$ref: "#/components/parameters/WorkspaceHeader"}
        - {$ref: "#/components/parameters/SourceIdPath"}
      responses:
        "200":
          description: Suggestion stored (status `suggested`)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ColumnMapping"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /v1/sources/{source_id}/mapping/preview:
    post:
      tags: [sources]
      operationId: previewMapping
      summary: Apply a candidate mapping to the first rows without saving (Confirm screen)
      description: Reads up to `limit` rows live from the tool, applies the mapping and normalisation, and returns map features plus per-row problems.
      parameters:
        - {$ref: "#/components/parameters/WorkspaceHeader"}
        - {$ref: "#/components/parameters/SourceIdPath"}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MappingSpec"}
      responses:
        "200":
          description: Preview
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MappingPreview"}
        "422": {$ref: "#/components/responses/Unprocessable"}

  /v1/sources/{source_id}/mapping/confirm:
    post:
      tags: [sources]
      operationId: confirmMapping
      summary: Confirm a mapping (editor); starts a full sync
      description: Stores a new `confirmed` version (the previous one becomes `superseded`), sets the source `active`, and syncs. Entities from rows that no longer map are deleted with their risks.
      parameters:
        - {$ref: "#/components/parameters/WorkspaceHeader"}
        - {$ref: "#/components/parameters/SourceIdPath"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MappingSpec"}
      responses:
        "200":
          description: Confirmed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ColumnMapping"}
        "422": {$ref: "#/components/responses/Unprocessable"}

  # --- entities ------------------------------------------------------------------------
  /v1/entities:
    get:
      tags: [entities]
      operationId: listEntities
      summary: List entities
      parameters:
        - {$ref: "#/components/parameters/WorkspaceHeader"}
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Cursor"}
        - {name: kind, in: query, schema: {$ref: "#/components/schemas/EntityKind"}}
        - {name: country, in: query, schema: {$ref: "#/components/schemas/Country"}}
        - {name: source_id, in: query, schema: {type: string, format: uuid}}
        - {name: q, in: query, description: Case-insensitive substring of the name, schema: {type: string, maxLength: 100}}
      responses:
        "200":
          description: Page of entities, ordered by kind then name
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: "#/components/schemas/Page"}
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: {$ref: "#/components/schemas/Entity"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /v1/entities/{entity_id}:
    get:
      tags: [entities]
      operationId: getEntity
      summary: One entity with its open risks (entities are read-only; edit them in the source tool)
      parameters:
        - {$ref: "#/components/parameters/WorkspaceHeader"}
        - {name: entity_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: "#/components/schemas/Entity"}
                  - type: object
                    required: [risks]
                    properties:
                      risks:
                        type: array
                        items: {$ref: "#/components/schemas/Risk"}
        "404": {$ref: "#/components/responses/NotFound"}

  # --- risks ------------------------------------------------------------------------
  /v1/risks:
    get:
      tags: [risks]
      operationId: listRisks
      summary: Filtered list of risks (Main screen sheet)
      parameters:
        - {$ref: "#/components/parameters/WorkspaceHeader"}
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Cursor"}
        - name: status
          in: query
          description: Comma-separated; default `open,acknowledged,mitigating`
          schema: {type: string, examples: ["open,acknowledged"]}
        - name: category
          in: query
          description: Comma-separated RiskCategory values
          schema: {type: string}
        - {name: min_score, in: query, schema: {type: number, minimum: 0, maximum: 100}}
        - {name: entity_id, in: query, schema: {type: string, format: uuid}}
        - {name: entity_kind, in: query, schema: {$ref: "#/components/schemas/EntityKind"}}
        - {name: country, in: query, schema: {$ref: "#/components/schemas/Country"}}
        - {name: port, in: query, schema: {$ref: "#/components/schemas/Locode"}}
        - {name: since, in: query, description: last_seen_at on or after, schema: {type: string, format: date-time}}
        - name: sort
          in: query
          schema: {type: string, enum: ["-score", "-last_seen_at", "-first_seen_at", "-likelihood", "-impact"], default: "-score"}
        - name: group
          in: query
          description: |
            `story`: one item per story (`Risk.story.key`): the highest-scored matching risk of
            each, with `story.entities` listing every entity the story reaches. Without it, every
            risk is listed.
          schema: {type: string, enum: [story]}
      responses:
        "200":
          description: Page of risks
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: "#/components/schemas/Page"}
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: {$ref: "#/components/schemas/Risk"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /v1/risks/summary:
    get:
      tags: [risks]
      operationId: getRiskSummary
      summary: Counts and top risks for the Main screen header
      parameters:
        - {$ref: "#/components/parameters/WorkspaceHeader"}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RiskSummary"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /v1/risks/{risk_id}:
    parameters:
      - {$ref: "#/components/parameters/WorkspaceHeader"}
      - {$ref: "#/components/parameters/RiskIdPath"}
    get:
      tags: [risks]
      operationId: getRisk
      summary: One risk with entity, evidence, factors, history and advice (Risk screen)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RiskDetail"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      tags: [risks]
      operationId: updateRisk
      summary: Change status (editor)
      description: Users may set `acknowledged`, `mitigating`, `dismissed` or back to `open`. `resolved` is set by the engine only (422 otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: string, enum: [open, acknowledged, mitigating, dismissed]}
                note: {type: string, maxLength: 2000}
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Risk"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/Unprocessable"}

  # --- map layers (GeoJSON) ------------------------------------------------------------
  /v1/map/entities:
    get:
      tags: [map]
      operationId: mapEntities
      summary: The workspace's entities as map features
      description: Entities with `lat`/`lon` (their own, else their city's) are Points. Entities with only a country or port have `geometry` null and the dashboard places them by `countries[0]`/`ports[0]` (Natural Earth `ADM0_A3`, World Port Index UN/LOCODE). Not paginated; at most 5,000 features (then `truncated` is true).
      parameters:
        - {$ref: "#/components/parameters/WorkspaceHeader"}
        - {name: kind, in: query, schema: {$ref: "#/components/schemas/EntityKind"}}
        - {name: source_id, in: query, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: FeatureCollection
          content:
            application/geo+json:
              schema: {$ref: "#/components/schemas/EntityFeatureCollection"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /v1/map/risks:
    get:
      tags: [map]
      operationId: mapRisks
      summary: Risks grouped by place (country, port or point)
      description: One feature per place, with the count, max score and the top 5 risk ids there. `place_type` = `point` features have a geometry; `country` and `port` features have `geometry` null and are joined client-side on `place_key`.
      parameters:
        - {$ref: "#/components/parameters/WorkspaceHeader"}
        - {name: status, in: query, description: "Comma-separated; default open,acknowledged,mitigating", schema: {type: string}}
        - {name: category, in: query, schema: {type: string}}
        - {name: min_score, in: query, schema: {type: number, minimum: 0, maximum: 100, default: 0}}
      responses:
        "200":
          description: FeatureCollection
          content:
            application/geo+json:
              schema: {$ref: "#/components/schemas/RiskPlaceFeatureCollection"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /v1/map/events:
    get:
      tags: [map]
      operationId: mapEvents
      summary: Live feed events with a position or country (public data; no workspace needed)
      parameters:
        - {$ref: "#/components/parameters/Bbox"}
        - {name: since, in: query, description: "Default: 7 days ago", schema: {type: string, format: date-time}}
        - {name: types, in: query, description: "Comma-separated type prefixes, e.g. hazard.,port.disruption", schema: {type: string}}
        - {name: min_severity, in: query, schema: {type: number, minimum: 0, maximum: 1}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 5000, default: 2000}}
      responses:
        "200":
          description: FeatureCollection, newest first
          content:
            application/geo+json:
              schema: {$ref: "#/components/schemas/FeedEventFeatureCollection"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /v1/map/disruptions:
    get:
      tags: [map]
      operationId: mapDisruptions
      summary: Port disruptions (PortWatch) and chokepoints with their current status
      description: Chokepoints come from the engine's static table (risk-engine.md §5.3; until the engine is installed, only port disruptions are returned). A chokepoint's matching events are positioned `hazard.*` / `port.disruption` events within its radius, and news tagged `port_shipping_disruption` or `conflict` naming one of its aliases. `status` is `disrupted` if a matching event in the last 7 days has severity ≥ 0.66, `watch` if any matching event, else `normal`.
      parameters:
        - {$ref: "#/components/parameters/Bbox"}
      responses:
        "200":
          description: FeatureCollection
          content:
            application/geo+json:
              schema: {$ref: "#/components/schemas/DisruptionFeatureCollection"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  # --- feeds (read-only public data) ---------------------------------------------------
  /v1/feeds/events:
    get:
      tags: [feeds]
      operationId: listFeedEvents
      summary: List feed events
      parameters:
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Cursor"}
        - {name: source, in: query, schema: {type: string}}
        - {name: type, in: query, description: Exact type or a prefix ending in "." , schema: {type: string}}
        - {name: country, in: query, schema: {$ref: "#/components/schemas/Country"}}
        - {name: port, in: query, schema: {$ref: "#/components/schemas/Locode"}}
        - {name: software, in: query, description: "Exact software key, e.g. PyPI:requests", schema: {type: string}}
        - {name: event_type, in: query, description: Tagged event type (event_tags), schema: {$ref: "#/components/schemas/TaggedEventType"}}
        - {name: since, in: query, schema: {type: string, format: date-time}}
        - {$ref: "#/components/parameters/Bbox"}
      responses:
