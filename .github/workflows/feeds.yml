# Fetch and store the public feeds every 15 minutes, then analyse them
# (news tagging with GLiNER2 on CPU, spike detection on the stored series).
# Skips cleanly (exit 0, with a notice) until the DATABASE_URL_FEEDS secret exists.
# This repository is public: the CLI prints only per-source / per-step status and
# counts, never record contents or keys, and each secret is passed only to the steps
# that need it.
#
# Secrets (repository settings -> Secrets and variables -> Actions):
#   DATABASE_URL_FEEDS   fetch, analyse, prune (an rp_feeds login; see docs/database-roles.md)
#   DATABASE_URL_OWNER   "Apply migrations" only (the table owner). Optional: while it is
#                        unset, migrations fall back to DATABASE_URL_FEEDS, as before.
#   FRED_API_KEY, NVD_API_KEY, EIA_API_KEY, COMTRADE_API_KEY, OTX_API_KEY,
#   TIINGO_API_KEY, NEWSDATA_API_KEY, CURRENTS_API_KEY
#                        all optional: a source without its key reports "skipped (no key)"
#                        (nvd runs keyless at NVD's lower rate).
name: feeds

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "'all' or comma-separated source names (e.g. usgs,gdacs)"
        required: false
        default: all
      force:
        description: "Run sources (and spike detection) even if their minimum interval has not passed"
        type: boolean
        default: false
      analysis:
        description: "'all', 'tagging' or 'anomalies'"
        required: false
        default: all

permissions:
  contents: read

concurrency:
  group: feeds
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      configured: ${{ steps.secret.outputs.configured }}
    steps:
      - name: Check for database secret
        id: secret
        env:
          DATABASE_URL_FEEDS: ${{ secrets.DATABASE_URL_FEEDS }}
        run: |
          if [ -z "${DATABASE_URL_FEEDS}" ]; then
            echo "::notice title=Feeds skipped::The DATABASE_URL_FEEDS secret is not set, so nothing was fetched or stored."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secret.outputs.configured == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        if: steps.secret.outputs.configured == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jobs/requirements.txt

      - name: Install
        if: steps.secret.outputs.configured == 'true'
        run: pip install -r jobs/requirements.txt

      # Migrations need the table owner (CREATE on the schemas, roles, functions).
      - name: Apply migrations
        if: steps.secret.outputs.configured == 'true'
        env:
          DATABASE_URL_FEEDS: ${{ secrets.DATABASE_URL_OWNER || secrets.DATABASE_URL_FEEDS }}
        run: python -m jobs.migrate

      - name: Fetch feeds
        if: steps.secret.outputs.configured == 'true'
        env:
          DATABASE_URL_FEEDS: ${{ secrets.DATABASE_URL_FEEDS }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
          OTX_API_KEY: ${{ secrets.OTX_API_KEY }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
          CURRENTS_API_KEY: ${{ secrets.CURRENTS_API_KEY }}
          SOURCES: ${{ inputs.sources || 'all' }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: python -m jobs.run --sources "$SOURCES" $FORCE

      # Retention for Neon's 1 GB free tier; deletes at most once a day (see jobs/prune.py),
      # otherwise only prints the database size.
      - name: Prune old rows
        if: steps.secret.outputs.configured == 'true'
        env:
          DATABASE_URL_FEEDS: ${{ secrets.DATABASE_URL_FEEDS }}
        run: python -m jobs.prune

  analyse:
    needs: fetch
    # Runs after a fetch attempt (even a failed one: stored data can still be
    # analysed); skipped entirely when the secret is missing.
    if: ${{ !cancelled() && needs.fetch.outputs.configured == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      TRANSFORMERS_VERBOSITY: error
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jobs/requirements*.txt

      - name: Install (CPU-only torch, then the model stack)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.15.0
          pip install -r jobs/requirements-model.txt

      - name: Model cache key
        id: model
        run: echo "key=$(python -m jobs.analyse.download --cache-key)" >> "$GITHUB_OUTPUT"

      - name: Restore model
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ steps.model.outputs.key }}

      # The only step that reaches Hugging Face; it runs on a cache miss only.
      - name: Download model
        if: steps.restore.outputs.cache-hit != 'true'
        run: python -m jobs.analyse.download

      - name: Save model
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ steps.model.outputs.key }}

      - name: Apply migrations
        env:
          DATABASE_URL_FEEDS: ${{ secrets.DATABASE_URL_OWNER || secrets.DATABASE_URL_FEEDS }}
        run: python -m jobs.migrate

      - name: Analyse
        env:
          DATABASE_URL_FEEDS: ${{ secrets.DATABASE_URL_FEEDS }}
          HF_HUB_OFFLINE: "1"
          ANALYSIS: ${{ inputs.analysis || 'all' }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: python -m jobs.run --analyse --analysis "$ANALYSIS" $FORCE
