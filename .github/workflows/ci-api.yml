# api/ and worker/: tests against a throwaway Postgres 16 (migrated with the repository's
# runner, python -m jobs.migrate) with the real engine/ installed, including the end-to-end
# test (tests/apiservice/test_end_to_end.py), and both Docker images (each must contain the
# engine). Google, Composio and Groq are never called: the tests replace them
# (tests/apiservice), and the image checks run with --network none.
name: ci-api

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d api_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/api_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements*.txt
            worker/requirements.txt
            jobs/requirements*.txt
      - run: pip install -r api/requirements-dev.txt
      - name: The worker never needs the web framework
        run: python -c "import sys, worker.main, worker.scoring; assert 'fastapi' not in sys.modules"
      - run: python -m pytest tests/apiservice -v -p no:cacheprovider

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build api image
        run: docker build -f api/Dockerfile -t riskpredict-api:ci .
      - name: Build worker image
        run: docker build -f worker/Dockerfile -t riskpredict-worker:ci .
      - name: Import inside the images (no network)
        run: |
          docker run --rm --network none riskpredict-api:ci python -c "import api.main, engine; assert engine.chokepoints()"
          docker run --rm --network none riskpredict-worker:ci python -c "import sys, worker.main, engine; assert 'fastapi' not in sys.modules; print(engine.ENGINE_VERSION)"
      - name: Compose file is valid
        run: docker compose --profile app config --quiet

  # The combined image Render runs (infra/render/: API + worker in one container), at
  # Render's free limits (512 MB, 0.1 CPU): /healthz, the worker's long poll, SSE through
  # start.sh (worker → API → client), a what-if run, idle and peak memory, and that the
  # container stops when the worker dies. The numbers go to the job summary.
  render-image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: render_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d render_smoke"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jobs/requirements.txt
      - run: pip install -r jobs/requirements.txt
      - name: Build the combined image
        run: docker build -f infra/render/Dockerfile -t riskpredict-render:ci .
      - name: Imports inside the image (no network)
        run: docker run --rm --network none riskpredict-render:ci python -c "import api.main, worker.main, engine; assert engine.chokepoints()"
      - name: Smoke test at 512 MB / 0.1 CPU, with memory numbers
        env:
          SMOKE_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/render_smoke
        run: python infra/render/smoke.py --image riskpredict-render:ci

  # The deploy, destroy and db-roles workflows (and this file): actionlint, which also runs
  # shellcheck (preinstalled on the runner) on every run: block; and start.sh as POSIX sh.
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install actionlint (pinned release, checksum verified)
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum --check --strict
          tar xzf "${tarball}" actionlint
      - name: actionlint
        run: >-
          ./actionlint -color
          .github/workflows/deploy.yml .github/workflows/destroy.yml .github/workflows/db-roles.yml
          .github/workflows/ci-api.yml
      - name: start.sh is POSIX sh (shellcheck)
        run: shellcheck --shell=sh infra/render/start.sh
