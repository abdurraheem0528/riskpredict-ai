# api/ and worker/: tests against a throwaway Postgres 16 (migrated with the repository's
# runner, python -m jobs.migrate) with the real engine/ installed, including the end-to-end
# test (tests/apiservice/test_end_to_end.py), both Docker images (docker compose
# self-hosting; each must contain the engine), and the Vercel function bundle. Google, Composio and Groq are never called: the tests replace them
# (tests/apiservice), and the image checks run with --network none.
name: ci-api

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d api_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/api_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements*.txt
            worker/requirements.txt
            jobs/requirements*.txt
      - run: pip install -r api/requirements-dev.txt
      - name: The worker never needs the web framework
        run: python -c "import sys, worker.main, worker.scoring; assert 'fastapi' not in sys.modules"
      - run: python -m pytest tests/apiservice -v -p no:cacheprovider

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build api image
        run: docker build -f api/Dockerfile -t riskpredict-api:ci .
      - name: Build worker image
        run: docker build -f worker/Dockerfile -t riskpredict-worker:ci .
      - name: Import inside the images (no network)
        run: |
          docker run --rm --network none riskpredict-api:ci python -c "import api.main, engine; assert engine.chokepoints()"
          docker run --rm --network none riskpredict-worker:ci python -c "import sys, worker.main, engine; assert 'fastapi' not in sys.modules; print(engine.ENGINE_VERSION)"
      - name: Compose file is valid
        run: docker compose --profile app config --quiet

  # The Vercel function exactly as Deploy builds it (infra/vercel/bundle.py): its file list,
  # its size with the Python 3.12 Linux wheels Vercel installs (well under the 500 MB
  # limit), a cold `import app` in a fresh interpreter, and the app under an ASGI test
  # client against a migrated Postgres as a real rp_app login (/healthz, /v1/health,
  # sign-up, GET /v1/events). The numbers go to the job summary.
  vercel-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: bundle_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d bundle_smoke"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL_MIGRATE: postgresql://test:test@127.0.0.1:5432/bundle_smoke
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jobs/requirements.txt
      - run: pip install -r jobs/requirements.txt
      - name: Migrate the throwaway database
        env:
          DATABASE_URL_FEEDS: ${{ env.DATABASE_URL_MIGRATE }}
        run: python -m jobs.migrate
      - name: Build the bundle and list its files
        run: |
          python infra/vercel/bundle.py build "$RUNNER_TEMP/bundle"
          (cd "$RUNNER_TEMP/bundle" && find . -type f | sort)
      - name: Size, cold import and ASGI smoke test (as an rp_app login)
        run: |
          pw="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          echo "::add-mask::$pw"
          printf '%s\n' "$pw" | python infra/scripts/create_login_roles.py --role smoke_app:rp_app --password-stdin
          SMOKE_DATABASE_URL="postgresql://smoke_app:${pw}@127.0.0.1:5432/bundle_smoke" \
            python infra/vercel/bundle.py check "$RUNNER_TEMP/bundle" --max-mb 400

  # The deploy, destroy, worker and db-roles workflows (and this file): actionlint, which
  # also runs shellcheck (preinstalled on the runner) on every run: block.
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install actionlint (pinned release, checksum verified)
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum --check --strict
          tar xzf "${tarball}" actionlint
      - name: actionlint
        run: >-
          ./actionlint -color
          .github/workflows/deploy.yml .github/workflows/destroy.yml .github/workflows/db-roles.yml
          .github/workflows/worker.yml .github/workflows/ci-api.yml
