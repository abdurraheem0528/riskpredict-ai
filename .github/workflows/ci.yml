# Tests on every pull request and push to main: parsers against saved real responses, analysis
# logic (tagging model mocked), the migrations, writers and biz row-level security
# against a throwaway Postgres 16, and the API contract (docs/contracts). No network fetches and no model download (except the one USGS
# dry run in fetch-only, which checks the fetch job's install works end to end).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: feeds_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d feeds_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/feeds_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            jobs/requirements*.txt
            docs/contracts/requirements.txt
      - run: pip install -r jobs/requirements-dev.txt -r docs/contracts/requirements.txt
      - run: python -m pytest -v

  # The scheduled fetch job installs only jobs/requirements.txt; make sure the
  # fetch path never needs the analysis deps (numpy, scikit-learn, torch).
  fetch-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jobs/requirements.txt
      - run: pip install -r jobs/requirements.txt
      - name: Import without analysis deps
        run: python -c "import sys, jobs.run; assert 'numpy' not in sys.modules, 'jobs.run imported numpy'"
      - run: python -m jobs.run --help
      - name: Dry run one source (exits 0 even if the feed is down; fails only on a crash)
        run: python -m jobs.run --dry-run --sources usgs

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build jobs image
        run: docker build -f jobs/Dockerfile -t riskpredict-jobs:ci .
      - name: Dry run inside the image (CLI wiring only, no network)
        run: docker run --rm --network none --entrypoint python riskpredict-jobs:ci -m jobs.run --help

  # The API contract: lint it, and check that TypeScript types generate from it
  # and compile (the dashboard uses the same generator).
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lint openapi.yaml (Redocly)
        run: npx --yes @redocly/cli@2.76.0 lint --config docs/contracts/redocly.yaml docs/contracts/openapi.yaml
      - name: Generate TypeScript types
        run: npx --yes openapi-typescript@7.13.0 docs/contracts/openapi.yaml -o "$RUNNER_TEMP/openapi.d.ts"
      - name: Type-check them
        run: npx --yes -p typescript@6.0.3 tsc --noEmit --strict "$RUNNER_TEMP/openapi.d.ts"
