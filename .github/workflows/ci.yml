# Tests on every pull request: parsers against saved real responses, and the
# migrations + writer against a throwaway Postgres 16. No network fetches.
name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: feeds_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d feeds_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/feeds_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jobs/requirements-dev.txt
      - run: pip install -r jobs/requirements-dev.txt
      - run: python -m pytest -v

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build jobs image
        run: docker build -f jobs/Dockerfile -t riskpredict-jobs:ci .
      - name: Dry run inside the image (CLI wiring only, no network)
        run: docker run --rm --network none --entrypoint python riskpredict-jobs:ci -m jobs.run --help
