# Tests on every pull request: parsers against saved real responses, analysis
# logic (tagging model mocked), and the migrations + writers against a throwaway
# Postgres 16. No network fetches and no model download (except the one USGS
# dry run in fetch-only, which checks the fetch job's install works end to end).
name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: feeds_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d feeds_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/feeds_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jobs/requirements*.txt
      - run: pip install -r jobs/requirements-dev.txt
      - run: python -m pytest -v

  # The scheduled fetch job installs only jobs/requirements.txt; make sure the
  # fetch path never needs the analysis deps (numpy, scikit-learn, torch).
  fetch-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jobs/requirements.txt
      - run: pip install -r jobs/requirements.txt
      - name: Import without analysis deps
        run: python -c "import sys, jobs.run; assert 'numpy' not in sys.modules, 'jobs.run imported numpy'"
      - run: python -m jobs.run --help
      - name: Dry run one source (exits 0 even if the feed is down; fails only on a crash)
        run: python -m jobs.run --dry-run --sources usgs

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build jobs image
        run: docker build -f jobs/Dockerfile -t riskpredict-jobs:ci .
      - name: Dry run inside the image (CLI wiring only, no network)
        run: docker run --rm --network none --entrypoint python riskpredict-jobs:ci -m jobs.run --help
