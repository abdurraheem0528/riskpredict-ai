# The worker, run once after every feeds run (python -m worker --once): queued webhooks,
# Composio status, Drive watch renewal, due syncs, re-scoring when the feeds moved on,
# housekeeping and the 24 h event retention, then the content-hash re-read of every
# source. It follows feeds.yml, so the Neon database is already awake from the feed jobs
# and this job adds no wake-up of its own; it needs no schedule or cron-job.org entry.
#
# Its settings (DATABASE_URL_APP, TOKEN_ENCRYPTION_KEYS, the Google, Composio and Groq
# values) are read at start from the Vercel project's environment, where Deploy keeps
# them, with the VERCEL_TOKEN secret; each is masked before use and handed to the worker
# process in memory (infra/scripts/deploy.py worker-run). Nothing is copied by hand,
# written to a file or uploaded. Skips with a notice until Deploy has run.
# This repository is public: the worker logs counts, statuses and exception types only.
name: worker

on:
  workflow_run:
    workflows: [feeds]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  once:
    # After any finished feeds run (even a failed one touched the database); not after a cancelled one.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install
        run: pip install -r worker/requirements.txt

      - name: Run the worker once
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          WORKER_ONCE_BUDGET_SECONDS: "480"
        run: python infra/scripts/deploy.py worker-run
