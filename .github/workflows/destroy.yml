# One-click Destroy: Actions → destroy → Run workflow, type "destroy".
# Deletes the Vercel project "riskpredict-api" (its deployments and environment) and the
# Cloudflare Pages project "riskpredict" (either may already be gone). It NEVER touches
# Neon data: tables, rows and the feeds stay. Optionally it drops the riskpredict_app
# login (not its data). The secrets that lived only in the Vercel project's environment
# (JWT_SIGNING_KEY, TOKEN_ENCRYPTION_KEYS, DATABASE_URL_APP) go with it; a later Deploy
# makes new ones. The worker job (worker.yml) skips itself while no project exists.
name: destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to delete the Vercel project and the Cloudflare Pages project'
        required: true
      drop_app_role:
        description: "Also drop the riskpredict_app database login (the data stays)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: riskpredict-infra
  cancel-in-progress: false

jobs:
  destroy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Confirm
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "destroy" ]; then
            echo "::error title=Not confirmed::Type destroy (lower case) in the confirm box. Nothing was changed."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jobs/requirements.txt

      - name: Install
        if: inputs.drop_app_role
        run: pip install -r jobs/requirements.txt

      - name: Delete the Vercel project
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
        run: python infra/scripts/deploy.py vercel-destroy

      - name: Delete the Cloudflare Pages project
        id: pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python infra/scripts/deploy.py pages-destroy

      - name: Drop the riskpredict_app login
        id: role
        if: inputs.drop_app_role
        env:
          DATABASE_URL_OWNER: ${{ secrets.DATABASE_URL_OWNER }}
        run: python infra/scripts/deploy.py drop-app-role

      - name: Summary
        if: always()
        env:
          VERCEL: ${{ steps.vercel.outputs.vercel_removed }}
          PAGES: ${{ steps.pages.outputs.pages_removed }}
          ROLE: ${{ steps.role.outputs.role_removed }}
          DROP: ${{ inputs.drop_app_role }}
          OUTCOME: ${{ job.status }}
        run: |
          {
            echo "## RiskPredict AI destroy: ${OUTCOME}"
            echo
            echo "| What | Result |"
            echo "|---|---|"
            echo "| Vercel project riskpredict-api | ${VERCEL:-not removed} |"
            echo "| Cloudflare Pages project riskpredict | ${PAGES:-not removed} |"
            if [ "$DROP" = true ]; then
              echo "| Database login riskpredict_app | ${ROLE:-not removed} |"
            else
              echo "| Database login riskpredict_app | kept |"
            fi
            echo
            echo "**The data remains.** The Neon database, its tables and every row (feeds and business data) were not touched."
            echo "The feed jobs (feeds.yml) keep running; the worker job skips itself until the next Deploy."
            echo
            echo "The secrets that lived only in the Vercel project's environment went with it. A new Deploy"
            echo "generates new ones: everyone signs in again, and Google Sheets connections must be reconnected"
            echo "(their stored tokens were encrypted with the old TOKEN_ENCRYPTION_KEYS)."
          } >> "$GITHUB_STEP_SUMMARY"
