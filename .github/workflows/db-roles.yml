# Optional: switch the feed jobs to their own login (riskpredict_jobs, member of rp_feeds),
# instead of the Neon owner, without running anything on your own computer.
# Actions → db-roles → Run workflow. See docs/database-roles.md for the order of steps.
#
#   * RP_PASSWORD_RISKPREDICT_JOBS set: creates the login (or keeps an existing one; with
#     "rotate", sets the new password), then checks it.
#   * not set: only checks an existing login.
# Uses DATABASE_URL_OWNER. Prints only the role name, what was done and the checks.
name: db-roles

on:
  workflow_dispatch:
    inputs:
      rotate:
        description: "Set RP_PASSWORD_RISKPREDICT_JOBS as the new password of an existing riskpredict_jobs login"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: riskpredict-infra
  cancel-in-progress: false

jobs:
  jobs-role:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jobs/requirements.txt

      - run: pip install -r jobs/requirements.txt

      - name: Apply migrations (the rp_feeds group must exist)
        env:
          DATABASE_URL_FEEDS: ${{ secrets.DATABASE_URL_OWNER }}
        run: |
          if [ -z "$DATABASE_URL_FEEDS" ]; then
            echo "::error title=Missing secret::Add the DATABASE_URL_OWNER repository secret (the neondb_owner connection string) first."
            exit 1
          fi
          python -m jobs.migrate

      - name: Create or check riskpredict_jobs
        id: role
        env:
          DATABASE_URL_OWNER: ${{ secrets.DATABASE_URL_OWNER }}
          RP_PASSWORD_RISKPREDICT_JOBS: ${{ secrets.RP_PASSWORD_RISKPREDICT_JOBS }}
          ROTATE: ${{ inputs.rotate }}
        run: |
          if [ -n "$RP_PASSWORD_RISKPREDICT_JOBS" ]; then
            echo "mode=create" >> "$GITHUB_OUTPUT"
            args=(--dsn-env DATABASE_URL_OWNER --role riskpredict_jobs:rp_feeds)
            if [ "$ROTATE" = true ]; then args+=(--rotate); fi
            python infra/scripts/create_login_roles.py "${args[@]}"
          else
            echo "mode=check" >> "$GITHUB_OUTPUT"
            echo "RP_PASSWORD_RISKPREDICT_JOBS is not set: checking only."
            python infra/scripts/create_login_roles.py --dsn-env DATABASE_URL_OWNER --role riskpredict_jobs:rp_feeds --check
          fi

      - name: Summary
        if: always()
        env:
          MODE: ${{ steps.role.outputs.mode }}
          OUTCOME: ${{ steps.role.outcome }}
        run: |
          {
            echo "## riskpredict_jobs login: ${MODE:-not run}, ${OUTCOME}"
            echo
            if [ "$OUTCOME" = success ]; then
              echo "The login exists and is a plain member of rp_feeds (no SUPERUSER, BYPASSRLS or CREATEROLE; owns nothing)."
              echo
              echo "### Next: point the feed jobs at it"
              echo
              echo "1. Keep \`DATABASE_URL_OWNER\` as it is (the migrate steps of feeds.yml use it)."
              echo "2. Replace the \`DATABASE_URL_FEEDS\` secret with"
              echo "   \`postgresql://riskpredict_jobs:<RP_PASSWORD_RISKPREDICT_JOBS>@<host>/<database>?sslmode=require\`,"
              echo "   where \`<host>\` and \`<database>\` are the ones in \`DATABASE_URL_OWNER\`, using the **direct** host:"
              echo "   if the host's first part ends in \`-pooler\`, remove that (\`ep-abc-123-pooler.…\` → \`ep-abc-123.…\`)."
              echo "   URL-encode the password if it has characters other than letters, digits, \`-\` and \`_\`."
              echo "3. Run feeds.yml by hand (sources \`usgs\`, force on) and check \"Fetch feeds\" shows \`usgs ok\`."
            else
              echo "See the step log for the problem (names and statuses only). If the role does not exist yet,"
              echo "add the RP_PASSWORD_RISKPREDICT_JOBS secret (at least 16 characters, e.g. 32 random letters and digits) and run this again."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
