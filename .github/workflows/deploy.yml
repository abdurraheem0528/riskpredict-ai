# One-click Deploy: Actions → deploy → Run workflow (on main). Free tiers only, no card,
# all in GitHub Actions. Re-running it updates everything in place.
#
#   1. migrations (python -m jobs.migrate as the Neon owner)
#   2. Cloudflare Pages project "riskpredict" (created if missing) → the dashboard URL
#   3. the riskpredict_app login (created once; --check afterwards; rotated when the
#      Vercel project has no DATABASE_URL_APP yet) and the Vercel Hobby project
#      "riskpredict-api" (Python/FastAPI, Deployment Protection off, function region next
#      to the Neon host): its environment, a clean bundle of the API (infra/vercel/
#      bundle.py, size-checked), a production deploy, and a /healthz check
#   4. the dashboard built with VITE_API_URL = the Vercel URL, deployed with wrangler
#   5. WEB_ORIGIN re-checked against the Pages URL (redeploys only if it changed)
#
# Secrets: VERCEL_TOKEN, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, DATABASE_URL_OWNER,
# GROQ_API_KEY (required); the Google and Composio ones (optional: skipped while empty).
# Generated here and kept only in the Vercel project's environment: DATABASE_URL_APP,
# JWT_SIGNING_KEY, TOKEN_ENCRYPTION_KEYS (the last two are never overwritten). The worker
# job (worker.yml) reads what it needs from there with the same VERCEL_TOKEN.
# Optional repository variables: VERCEL_TEAM_ID (only to deploy into a team instead of
# your personal account), GROQ_MAPPING_MODEL, GROQ_ADVICE_MODEL.
# This repository is public: no step prints a secret, and nothing is uploaded.
name: deploy

on:
  workflow_dispatch:
    inputs:
      rotate_app_password:
        description: "Give the riskpredict_app login a new password and update DATABASE_URL_APP on Vercel"
        type: boolean
        default: false
      vercel_region:
        description: "Vercel function region ('auto' = closest to the Neon host)"
        type: choice
        default: auto
        options: [auto, iad1, cle1, pdx1, sfo1, yul1, gru1, fra1, lhr1, dub1, cdg1, arn1, sin1, syd1, hnd1, kix1, icn1, hkg1, bom1, cpt1]

permissions:
  contents: read

# Deploy and Destroy never overlap (same group in destroy.yml and db-roles.yml).
concurrency:
  group: riskpredict-infra
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check the required secrets are set
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL_OWNER: ${{ secrets.DATABASE_URL_OWNER }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          missing=""
          for name in VERCEL_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DATABASE_URL_OWNER GROQ_API_KEY; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=Missing secrets::Add these repository secrets first:$missing"
            exit 1
          fi
          echo "All required secrets are set."

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jobs/requirements.txt

      - name: Install
        run: pip install -r jobs/requirements.txt

      - name: Apply migrations
        env:
          DATABASE_URL_FEEDS: ${{ secrets.DATABASE_URL_OWNER }}
        run: python -m jobs.migrate

      - name: Cloudflare Pages project
        id: pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python infra/scripts/deploy.py pages-ensure

      # Node runs the pinned Vercel CLI (npx) and builds the dashboard.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: App login role and Vercel project (bundle, deploy, /healthz)
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          DATABASE_URL_OWNER: ${{ secrets.DATABASE_URL_OWNER }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_PICKER_API_KEY: ${{ secrets.GOOGLE_PICKER_API_KEY }}
          GOOGLE_CLOUD_PROJECT_NUMBER: ${{ secrets.GOOGLE_CLOUD_PROJECT_NUMBER }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_WEBHOOK_SECRET: ${{ secrets.COMPOSIO_WEBHOOK_SECRET }}
          COMPOSIO_AUTH_CONFIGS: ${{ secrets.COMPOSIO_AUTH_CONFIGS }}
          COMPOSIO_TRIGGER_SLUGS: ${{ secrets.COMPOSIO_TRIGGER_SLUGS }}
          GROQ_MAPPING_MODEL: ${{ vars.GROQ_MAPPING_MODEL }}
          GROQ_ADVICE_MODEL: ${{ vars.GROQ_ADVICE_MODEL }}
          WEB_ORIGIN: ${{ steps.pages.outputs.pages_url }}
          ROTATE: ${{ inputs.rotate_app_password }}
          REGION: ${{ inputs.vercel_region || 'auto' }}
        run: |
          args=(--web-origin "$WEB_ORIGIN" --region "$REGION")
          if [ "$ROTATE" = true ]; then args+=(--rotate-app-password); fi
          python infra/scripts/deploy.py vercel-up "${args[@]}"

      - name: Build the dashboard
        working-directory: web
        env:
          VITE_API_URL: ${{ steps.vercel.outputs.api_url }}
        run: |
          npm ci
          npm run build
          npm run check:bundle

      - name: Deploy the dashboard to Cloudflare Pages
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ steps.pages.outputs.pages_project }}
          COMMIT: ${{ github.sha }}
        run: npx --yes wrangler@4.168.0 pages deploy dist --project-name "$PROJECT" --branch main --commit-hash "$COMMIT"

      # The production URL, read again after the deploy; WEB_ORIGIN must match it.
      - name: Cloudflare Pages URL after the deploy
        id: pages_after
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python infra/scripts/deploy.py pages-ensure

      - name: WEB_ORIGIN on Vercel (redeploys only if it changed)
        id: origin
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          WEB_ORIGIN: ${{ steps.pages_after.outputs.pages_url }}
          REGION: ${{ steps.vercel.outputs.vercel_region }}
        run: python infra/scripts/deploy.py vercel-origin --web-origin "$WEB_ORIGIN" --region "$REGION"

      - name: Summary
        if: always()
        env:
          API_URL: ${{ steps.vercel.outputs.api_url }}
          WEB_URL: ${{ steps.pages_after.outputs.pages_url || steps.pages.outputs.pages_url }}
          CREATED: ${{ steps.vercel.outputs.created }}
          REGION: ${{ steps.vercel.outputs.vercel_region }}
          BUNDLE_MB: ${{ steps.vercel.outputs.bundle_mb }}
          ORIGIN_CHANGED: ${{ steps.origin.outputs.origin_changed }}
          REPO: ${{ github.repository }}
          OUTCOME: ${{ job.status }}
        run: |
          {
            echo "## RiskPredict AI deploy: ${OUTCOME}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Dashboard | ${WEB_URL:-not deployed} |"
            echo "| API | ${API_URL:-not deployed} |"
            echo "| Vercel project | riskpredict-api, Hobby, region ${REGION:-?}, $( [ "$CREATED" = true ] && echo 'created now' || echo 'updated in place' ) |"
            echo "| Function bundle | ${BUNDLE_MB:-?} MB of Vercel's 500 MB |"
            echo "| WEB_ORIGIN | $( [ "$ORIGIN_CHANGED" = true ] && echo 'changed, redeployed' || echo 'matches the dashboard' ) |"
            echo
            echo "Secrets generated by this workflow live only in the Vercel project's environment; none are shown here."
            echo
            echo "### Feeds every 30 minutes (cron-job.org, free)"
            echo
            echo "Keep (or create) one job at https://cron-job.org: every 30 minutes,"
            echo "\`POST https://api.github.com/repos/${REPO}/actions/workflows/feeds.yml/dispatches\`"
            echo "with body \`{\"ref\":\"main\"}\` and headers"
            echo "\`Authorization: Bearer <fine-grained PAT: this repository only, Actions: read and write>\` and"
            echo "\`Accept: application/vnd.github+json\`."
            echo
            echo "Nothing else is needed: the worker (worker.yml) runs by itself after each feeds run,"
            echo "while the database is awake, and the API on Vercel needs no keep-awake ping."
            echo "**Delete the old keep-awake ping** to \`/healthz\` if you made one for Render."
          } >> "$GITHUB_STEP_SUMMARY"
